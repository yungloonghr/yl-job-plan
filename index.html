<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>永隆工程｜職務計畫追蹤系統</title>
<style>
:root{
  --navy:#1e3a5f;--navy2:#2c5282;--ink:#0f172a;--txt:#1e293b;--slate:#475569;--mut:#64748b;
  --line:#e2e8f0;--line2:#cbd5e1;--bg:#f1f5f9;--card:#fff;--soft:#f8fafc;--blue-l:#eaf1fb;
  --teal:#0f9488;--teal2:#0b7a70;--teal-l:#e5f5f3;
  --red:#c0392b;--red-l:#fdecea;--amb:#b7791f;--amb-l:#fff4dc;--grn:#2f855a;--grn-l:#e6f4ea;--pur:#6b46c1;--pur-l:#f1ecfb;
  --sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);--r:12px;
  /* 人事類型顏色對照（Type Color Mapping）：全系統的類型標籤只從這裡取色 */
  --type-new:#147D70;      /* 新進：深青綠 */
  --type-transfer:#A65320; /* 調職：深橘 */
  --type-promo:#5945A5;    /* 晉升：深紫 */
  --type-pip:#8C2F39;      /* PIP改善：深酒紅 */
  --type-fg:#FFFFFF
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
.ic{flex:none;vertical-align:-3px}
button{font:inherit}
/* ---------- 頂部列 ---------- */
header.top{background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(15,23,42,.15)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2c5282,#0f9488);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.5px}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px;line-height:1.2}
header.top .role{font-size:12px;opacity:.75}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16)}
.badge.demo{background:#fbd38d;color:#5f3a00}
.spacer{flex:1}
main{max-width:1180px;margin:0 auto;padding:22px 16px 110px}
/* ---------- 基本元件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:var(--sh)}
.card>h2,.sec-hd h2{font-size:17px;margin:0 0 14px;color:var(--navy);display:flex;align-items:center;gap:8px}
.sec-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-hd h2{margin:2px 0 4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--teal);text-transform:uppercase}
.sub-hd{font-size:13px;font-weight:600;color:var(--slate);margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--slate);font-weight:500}
label.f em,div.f em,.lbl em{font-style:normal;font-weight:400;color:var(--mut);font-size:12px}
input,select,textarea{font:inherit;color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;background:#fff;width:100%;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:72px;line-height:1.65}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,148,136,.15)}
input[disabled],textarea[disabled],select[disabled]{background:var(--soft);color:#334155}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:filter .15s,background .15s,transform .05s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.o{background:#fff;color:var(--navy);border-color:var(--line2)}
.btn.o:hover{background:var(--soft);filter:none;border-color:var(--navy)}
.btn.t{background:var(--teal);border-color:var(--teal)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.r{background:#fff;color:var(--red);border-color:#f0b4ad}
.btn.s{padding:5px 10px;font-size:13px}
.btn.lg{padding:11px 20px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.iconbtn{border:1px solid transparent;background:transparent;border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--slate)}
.iconbtn:hover{background:var(--soft);border-color:var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.pre{white-space:pre-wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:999px;background:#eef2f6;color:#475569;white-space:nowrap;font-weight:500}
.chip.g{background:var(--grn-l);color:var(--grn)}
.chip.a{background:var(--amb-l);color:var(--amb)}
.chip.r{background:var(--red-l);color:var(--red)}
.chip.b{background:var(--blue-l);color:var(--navy2)}
.chip.p{background:var(--teal-l);color:var(--teal2)}
.type{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;color:var(--type-fg);background:var(--slate);font-weight:500;white-space:nowrap}
.type.新進{background:var(--type-new)}.type.調職{background:var(--type-transfer)}.type.晉升{background:var(--type-promo)}.type.PIP改善{background:var(--type-pip)}
.tip{display:flex;gap:10px;background:var(--teal-l);border:1px solid #c5e8e4;color:#134e4a;border-radius:10px;padding:11px 14px;font-size:14px;margin-bottom:14px}
.tip .ic{margin-top:3px;color:var(--teal)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;border:1px solid transparent}
.banner .ic{margin-top:3px}
.banner.g{background:var(--grn-l);color:#22543d;border-color:#c6e6d1}
.banner.a{background:var(--amb-l);color:#744210;border-color:#f3dca5}
.banner.b{background:var(--blue-l);color:var(--navy);border-color:#cfdcf0}
.bar{height:8px;border-radius:999px;background:#e5eaf1;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#2c9fd1);border-radius:999px;transition:width .3s}
.bar.sm{height:6px}
.loading{padding:60px;text-align:center;color:var(--mut)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:#0f172a;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.stickybar{position:sticky;bottom:0;z-index:15;background:rgba(241,245,249,.97);backdrop-filter:blur(4px);padding:12px 0;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);margin-top:6px}
.stickybar .sp{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
/* ---------- 對話框與抽屜 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade .15s}
.dlg{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(15,23,42,.3)}
.dlg.wide{max-width:900px}
.dlg h2{font-size:18px;margin:0 0 12px;color:var(--navy);display:flex;gap:8px;align-items:center}
.dlg-hd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.dlg-hd h2{margin:0}
.dlg-ic{width:40px;height:40px;border-radius:10px;background:var(--blue-l);color:var(--navy2);display:flex;align-items:center;justify-content:center;flex:none}
.dlg-hd.danger .dlg-ic{background:var(--red-l);color:var(--red)}
.dlg-hd.ok .dlg-ic{background:var(--grn-l);color:var(--grn)}
.dlg-bd{font-size:14px;color:var(--slate)}
.dlg-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.misslist{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.misslist li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.misslist li:last-child{border-bottom:none}
.misslist li .ic{color:var(--red)}
.misslist li span{flex:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:90;opacity:0;transition:opacity .2s}
.drawer-mask.on{opacity:1}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(15,23,42,.2);transform:translateX(30px);transition:transform .2s}
.drawer-mask.on .drawer{transform:none}
.dr-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dr-hd h2{margin:2px 0 0;font-size:17px;color:var(--navy)}
.dr-tools{padding:12px 20px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:var(--soft)}
.seg3{display:flex;background:#e5eaf1;border-radius:9px;padding:3px}
.seg3 button{flex:1;border:none;background:transparent;padding:7px 6px;border-radius:7px;cursor:pointer;color:var(--slate);font-size:13px}
.seg3 button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dr-bd{flex:1;overflow:auto;padding:16px 20px}
.dr-ft{padding:14px 20px;border-top:1px solid var(--line);background:#fff}
.warn{display:flex;gap:8px;font-size:13px;color:#744210;background:var(--amb-l);border:1px solid #f3dca5;border-radius:8px;padding:9px 12px;margin-bottom:10px}
.exgoal{background:var(--blue-l);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;color:var(--navy)}
.excard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13.5px}
.exn{font-weight:600;color:var(--navy);margin-bottom:6px}
.exl{font-size:12px;font-weight:600;color:var(--navy2);margin:8px 0 2px;display:flex;gap:5px;align-items:center}
.exl.out{color:var(--grn)}
/* ---------- 選單 ---------- */
.menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);padding:6px;min-width:170px;animation:fade .1s}
.menu button{display:flex;gap:9px;align-items:center;width:100%;border:none;background:none;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--txt);text-align:left}
.menu button:hover{background:var(--soft)}
.menu button.dz{color:var(--red)}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}

/* ---------- HR 儀表板 ---------- */
.pagehd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehd h2{font-size:22px;margin:2px 0 2px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:16px 18px;cursor:pointer;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;transition:border-color .15s,transform .1s}
.stat:hover{border-color:var(--line2);transform:translateY(-1px)}
.stat.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,148,136,.15)}
.stat .si{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.stat .sn{font-size:26px;font-weight:700;color:var(--ink);line-height:1.1}
.stat .sl{font-size:13px;color:var(--mut)}
.si.c0{background:#eef2f6;color:var(--slate)}.si.c1{background:var(--blue-l);color:var(--navy2)}.si.c2{background:var(--amb-l);color:var(--amb)}.si.c3{background:var(--grn-l);color:var(--grn)}
.alerts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.alert{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:10px;font-size:13.5px;cursor:pointer;border:1px solid transparent;background:none}
.alert.r{background:var(--red-l);color:var(--red);border-color:#f3c4be}
.alert.a{background:var(--amb-l);color:var(--amb);border-color:#f3dca5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{padding-left:36px}
.toolbar select{width:auto;min-width:130px}
table.list{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.list th{background:var(--soft);color:var(--slate);text-align:left;padding:10px 12px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:12px;border-bottom:1px solid #eef1f5;vertical-align:middle}
table.list tr:hover td{background:#fafcfe}
.who{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2c5282,#0f9488);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.avatar.lg{width:56px;height:56px;font-size:22px}
.who b{display:block;color:var(--ink)}
.segs{display:flex;gap:4px;margin-bottom:5px}
.sg{font-size:11px;padding:2px 8px;border-radius:5px;background:#eef2f6;color:#94a3b8;font-weight:600;white-space:nowrap}
.sg.g{background:var(--grn-l);color:var(--grn)}.sg.b{background:var(--blue-l);color:var(--navy2)}.sg.a{background:var(--amb-l);color:var(--amb)}.sg.r{background:var(--red-l);color:var(--red)}.sg.p{background:var(--teal-l);color:var(--teal2)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
@media(max-width:860px){
  table.list thead{display:none}
  table.list,table.list tbody,table.list tr,table.list td{display:block;width:100%}
  table.list tr{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:6px 4px;background:#fff}
  table.list td{border:none;padding:6px 12px;display:flex;gap:10px;align-items:center}
  table.list td[data-label]::before{content:attr(data-label);width:72px;flex:none;font-size:12px;color:var(--mut)}
  .acts{justify-content:flex-start;flex-wrap:wrap}
}
.linkbox{display:flex;gap:6px;margin-top:10px}
.linkbox input{font-size:13px;background:var(--soft)}
.preview-dates{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pd{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.pd b{color:var(--navy)}
.optlist{display:flex;flex-direction:column;gap:8px}
.optlist label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.optlist label:has(input:checked){border-color:var(--teal);background:var(--teal-l)}
.optlist input{width:auto}

/* ---------- 主管端 ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.hero-who{display:flex;gap:14px;align-items:center}
.hero-who h2{margin:4px 0 0;font-size:21px;color:var(--ink)}
.infogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.info{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.info .k{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.info .v{font-weight:600;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.info.wide{grid-column:span 2}
@media(max-width:480px){.info.wide{grid-column:auto}}
.prog-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog-hd b{color:var(--navy);font-size:15px}
.pct{font-size:22px;font-weight:700;color:var(--teal)}
.progd>summary{list-style:none;cursor:pointer;display:block;user-select:none}
.progd>summary::-webkit-details-marker{display:none}
.progd .prog-hd{align-items:center;gap:8px}
.progd .prog-hd b{display:flex;align-items:center;gap:8px}
.progd .prog-hd b::before{content:'';width:0;height:0;border-left:7px solid #f97316;border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s;flex:none}
.progd[open] .prog-hd b::before{transform:rotate(90deg)}
.progd>summary:hover .prog-hd b::before{border-left-color:#ea580c}
.progd .prog-hd .egs-tg{margin-left:auto;font-size:12px;color:var(--mut);font-weight:400}
.progd:not([open])>summary .bar{margin-bottom:0}
.nexta{display:flex;gap:8px;align-items:center;margin:12px 0 14px;font-size:14px;color:var(--navy);background:var(--blue-l);border-radius:9px;padding:9px 12px}
.miles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media(max-width:760px){.miles{grid-template-columns:repeat(2,1fr)}}
.mile{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative;transition:border-color .15s}
.mile:hover:not([disabled]){border-color:var(--line2)}
.mile .mt{font-weight:600;color:var(--ink);font-size:14px;display:flex;gap:6px;align-items:center}
.mile .ms{font-size:12px;color:var(--mut)}
.mile.cur{border-color:var(--navy);box-shadow:0 0 0 3px rgba(44,82,130,.12)}
.mile.done .mt .ic{color:var(--grn)}
.mile.done{background:#fbfefc}
.mile[disabled]{opacity:.55;cursor:not-allowed;background:var(--soft)}
.mile .mdot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;flex:none}
.mile.prog .mdot{background:var(--teal)}.mile.late .mdot{background:var(--red)}
/* 步驟導覽 */
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px;counter-reset:s}
@media(max-width:860px){.stepper{display:flex;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}.stepper .stp{min-width:150px;scroll-snap-align:start}}
.stp{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden}
.stp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#e2e8f0}
.stp-no{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--mut)}
.stp-t{font-size:14px;font-weight:600;color:var(--ink)}
.stp-s{font-size:12px;display:flex;align-items:center;gap:4px;color:var(--mut)}
.stp.prog::after{background:var(--amb)}.stp.prog .stp-s{color:var(--amb)}
.stp.done::after{background:var(--grn)}.stp.done .stp-s{color:var(--grn)}
.stp.cur{border-color:var(--navy);box-shadow:0 0 0 3px rgba(44,82,130,.12)}
.stp.cur .stp-no{color:var(--teal)}
/* 評估面向卡片 */
.dimgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dimcard{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff;min-height:112px;position:relative}
.dimcard .dno{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:1px}
.dimcard .dname{font-size:15px;font-weight:600;color:var(--ink);flex:1;overflow-wrap:anywhere}
.dimcard .dname.empty{color:var(--mut);font-weight:400;font-style:italic}
.dimcard .dacts{display:flex;gap:6px}
.dimcard.editing{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,148,136,.12)}

details.plandoc{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px}

/* 五步驟流程：只說明標準作業順序，不顯示任何人員的實際進度 */
.fl{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr) 16px minmax(0,1fr) 22px minmax(0,1fr) 16px minmax(0,1fr);grid-template-rows:auto auto;gap:6px 0;align-items:stretch}
.fl-ph{grid-row:1;font-size:12.5px;font-weight:600;border-radius:8px;padding:5px 10px;display:flex;align-items:center;gap:6px}

<script>
/* =====================================================================
   設定區：部署 Apps Script 後，把「網頁應用程式網址」貼在下面引號內。
   留空 = 示範模式（資料只存在這台電腦的瀏覽器，用來試用）
   ===================================================================== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyobPZrl3oui-eA2u2xY6CrSsRAB4_HuNdT5zHrx_n8PJnS1VRnZO8fsn5gFsU4Jok/exec';
/* ===================================================================== */

const DEMO = !GAS_URL;
const RATINGS = ['未達標準','表現尚可','表現優異'];
const CONCLUSIONS = ['通過','延長觀察','不通過'];
const TYPES = ['新進','晉升','調職','PIP改善'];
/* 延長階段：主管在第三（或第四）階段評核選「延長觀察」並選擇延長 1～3 個月、受評人員勾選確認，
   評核表雙方簽名送出後，系統自動建立下一個延長階段；人資只需在期滿時開啟評核。最多到第五階段（Code.gs 有相同規則） */
const BASE_STAGES = 3, MAX_STAGES = 5, CN = ['一','二','三','四','五','六','七'], EXT_MONTHS = [1,2,3];   // 六、七：5 階段評核案件的延長階段名稱
const EXT_ACK = '受評人員已了解延長觀察的原因、延長期間，以及延長期間的改善重點與評核方式，並同意延長觀察。';
/* 第 i 個階段選「延長觀察」時是否會建立延長階段：第三階段起、且為目前最後一個階段、尚未達第五階段 */
const canExtendAt = (c,i) => i>=BASE_STAGES-1 && i===c.stages.length-1 && c.stages.length<MAX_STAGES;
/* 延長期間的目標與工作面向（主管在評核表選延長觀察時設定，與評核一起雙方簽名；送出後成為延長階段的內容） */
function cleanExtPlan(p){ p=(p&&typeof p==='object')?p:{}; const t=(x,n)=>String(x==null?'':x).slice(0,n);
  const dims=(Array.isArray(p.dims)?p.dims:[]).map(x=>t(x,50)).slice(0,6), it=Array.isArray(p.items)?p.items:[];
  return {goal:t(p.goal,3000), dims, items:dims.map((_,j)=>({content:t(it[j]&&it[j].content,3000), outcome:t(it[j]&&it[j].outcome,3000)}))}; }
const extPlanFrom = s => ({goal:s.goal, dims:s.dims.slice(), items:s.items.map(it=>({content:it.content,outcome:it.outcome}))});
const extRange = (s,m) => { const f=addD(parseD(s.to),1), t=addD(addM(f,m),-1); return [fmt(f),fmt(t)]; };
/* 表單代號：'plan' 職務計畫書｜數字 i 第 i+1 階段評核｜'x3'／'x4' 第四／五階段的延長計畫｜'r00'～'r21' 第 i+1 階段的第 k+1 次追蹤評核 */
const parsePart = p => { if(p==='plan') return 'plan'; const s=String(p), m=/^x([34])$/.exec(s); if(m) return 'x'+m[1]; if(/^r[0-2][01]$/.test(s)) return s; return Number(p); };
const isExtPart = p => typeof p==='string' && p.charAt(0)==='x';
/* ===== 評核次數（全年度版本適用；Code.gs 有相同的 CADENCES）=====
   計畫書維持三個階段；rv[i]＝第 i 個階段內的「追蹤評核」月份（自計畫起始日起算第 N 個月的最後一天）。
   追蹤評核到預計日期自動開放、需雙方簽名，結果只有「進度符合預期／需加強輔導」，沒有通過／延長／不通過；
   各階段的正式評核仍在階段結束時由人資開啟，且須先完成該階段的追蹤評核 */
const CADENCES = {
  std: {name:'標準 3 次',   months:'3、7、12',       rv:[[],[],[]]},
  hh5: {name:'獵頭 5 次',   months:'1、2、3、7、12', rv:[[1,2],[],[]]},
  mgr5:{name:'管理職 5 次', months:'1、3、5、7、12', rv:[[1],[5],[]]},
  /* 5 階段評核（2026-11 新增）：月份同獵頭 5 次，但第 1、2 個月為「正式評核」：由人資開啟，結論為通過／延長觀察／不通過（不會建立延長階段）。
     顯示名稱：第 1、2 個月＝第一、二階段評核；第 3、7、12 個月＝第三、四、五階段評核；這三次評核仍分別依職務計畫書第 1-3／4-7／8-12 個月的計畫內容 */
  f5:  {name:'5 階段評核',    months:'1、2、3、7、12', rv:[[1,2],[],[]], formal:true}
};
/* 新增案件時可選的評核次數（舊案件的獵頭 5 次、管理職 5 次照常顯示，只是不再提供新增） */
const NEW_CADS = [['std','3 階段評核'],['f5','5 階段評核']];
const rvFormal = c => !!CADENCES[cadOf(c)].formal;                 // 此案件的階段中評核是否為正式評核
const rvResults = c => rvFormal(c) ? CONCLUSIONS : RV_RESULTS;     // 結論選項
const rvKind = c => rvFormal(c) ? '評核' : '追蹤評核';              // 顯示用名稱

const planLabel = (c,s) => rvFormal(c) && !s.ext ? s.range+'計畫' : s.label;

const shortLabel = l => String(l).replace(/^第(.)階段$/,'$1');   // 第三階段 → 三（人資列表的小格）
const RV_RESULTS = ['進度符合預期','需加強輔導'];
const RV_GRACE = 14;   // 追蹤評核開放後超過幾天未完成視為逾期（僅提醒用）
const cadOf = c => CADENCES[c && c.cadence] ? c.cadence : 'std';
const isRvPart = p => typeof p==='string' && /^r[0-2][01]$/.test(p);
const rvOf = (c,p) => c.stages[Number(p[1])].reviews[Number(p[2])];
/* 追蹤評核是否輪到：計畫書已簽核、前一階段評核已完成、同階段前面的追蹤評核已完成 */
const rvReady = (c,i,k) => { const s=c.stages[i]; return !!(s && s.reviews && s.reviews[k]) && c.plan.locked && (i===0 || c.stages[i-1].eval.locked) && s.reviews.slice(0,k).every(r=>r.eval.locked); };
/* 追蹤評核可填寫：輪到了、尚未完成、且已到預計日期（自動開放，不需人資開啟） */
const rvOpen = (c,i,k) => rvReady(c,i,k) && !c.stages[i].reviews[k].eval.locked && (rvFormal(c) ? c.stages[i].reviews[k].eval.open===true : today()>=c.stages[i].reviews[k].due);   // 5 次評核：須由人資開啟

const timeline = c => c.stages.flatMap((s,i)=>(s.reviews||[]).map((r,k)=>({rv:true,i,k,r,s,p:'r'+i+k})).concat([{rv:false,i,s,p:i}]));

const nextItem = c => c.plan.locked ? (timeline(c).find(x=>!itemDone(x)) || null) : null;

     '・完成經理職責清單與授權盤點表\n・建立回報資訊能支援廠長快速掌握現場風險\n・本人角色由「高產出執行者」開始轉向「管理責任承擔者」'],
    ['1. 盤點整壓計量站體、支撐架、氣體過濾器、維修及出貨相關流程之瓶頸。\n2. 建立「人、機、料、法、環」現況檢核表，標示優先改善順序。\n3. 針對過去常見延遲原因，建立交期預警與物料異常回報機制。',
     '・完成主要生產與維修流程盤點\n・列出三項需優先改善之瓶頸與對策草案\n・交期、物料、維修異常可被提早揭露，不再等問題擴大後才處理'],
    ['1. 挑選 1 至 2 名可培養為管理副手或關鍵幹部之人選，明確其承接範圍。\n2. 建立領班、幹部與生管人員之任務分派及回報機制。\n3. 每兩週與關鍵幹部進行一次工作回饋，聚焦判斷邏輯、問題處理與跨班協調。',
     '・副手候選人名單與培育重點明確\n・重要任務不再完全依賴本人親自吸收\n・幹部開始理解管理判斷標準與回報品質要求'],
    ['1. 檢視品質、職安政策在現場執行之落差，特別聚焦高風險作業、治工具、機具與外籍移工管理。\n2. 建立現場走動管理檢核重點，納入品質缺失、作業安全、設備狀態與人員配置。\n3. 每月彙整一次缺失與改善追蹤。',
     '・完成品質與職安初版檢核表\n・高風險設備或作業項目有改善追蹤\n・現場走動管理從經驗式巡查轉為有紀錄、有追蹤']]},
   {goal:'讓管理制度進入日常運作，強化獨立承擔、跨部門協調與團隊執行穩定度。',

    ['1. 將第一階段盤點之交期、物料與人力風險納入生產協調會。\n2. 建立生管、製造、維修、倉庫間的進度追蹤表，明確標示責任人與完成日。\n3. 針對插單、缺料、人力不足等情境，制定優先順序判斷原則並向團隊說明。',

    ['1. 將整壓計量站體、維修、出貨或表務作業中具重複性的流程，轉化為 SOP 或生產檢核表。\n2. 針對第一階段列出的前三項瓶頸，至少推動 2 項改善並追蹤成效。\n3. 建立任務完成後檢討機制，記錄原因、改善措施與後續預防方式。',

    ['1. 讓副手或關鍵幹部實際承接部分協調、追蹤或會議主持任務。\n2. 針對承接結果進行具體回饋，包含做得好的行為、待改善處與下一步要求。\n3. 建立幹部能力觀察表，記錄判斷力、溝通力、責任感與執行品質。',
     '・副手能獨立處理部分日常管理任務\n・本人能保留關鍵決策，不再事事親自處理\n・團隊能力缺口被具體辨識，培育行動可追蹤'],
    ['1. 將品質缺失、客訴風險、職安異常與外籍移工宿舍管理納入每月檢討。\n2. 針對治工具、機具與高風險作業完成改善或汰換追蹤。\n3. 要求幹部落實現場紀律與教育訓練紀錄。',

   {goal:'系統化管理能力，整合資源、培育梯隊，並支援工廠年度營運目標。',

    ['1. 建立工廠管理指標儀表板雛型，包含交期達成、異常件數、重工、維修進度、職安缺失與改善追蹤。\n2. 導入或優化行政表單、維修紀錄、生產追蹤等數位化管理方式。\n3. 向廠長提出數據化管理摘要或改善建議。',
     '・管理資訊可被定期回顧，不只依賴口頭掌握\n・至少完成 1 項表單或流程系統化改善\n・廠長可透過指標判斷工廠管理成熟度與風險'],
    ['1. 完成副手或關鍵幹部之階段性能力評估，明確下一年度訓練方向。\n2. 讓幹部主導部分例行會議、改善專案或跨班協調，經理由旁觀察與修正。\n3. 建立績效面談與工作回饋節奏，使團隊理解評分依據與改善目標。',
     '・至少 1 名副手或幹部能穩定承接管理任務\n・經理具備策略性授權能力，避免過度保護部屬\n・團隊不只依賴個人英雄式承擔，而能共同防禦風險'],
    ['1. 整合品質、職安、產能與人員管理，形成季度改善專案。\n2. 挑選高影響問題進行根因分析，要求團隊提出預防再發措施。\n3. 建立下一年度品質與職安改善目標，並與幹部責任連結。',

function autoGrow(root){
  const fit=list=>{ if(!list.length || list.some(t=>!t.offsetParent)) return; list.forEach(t=>{ t.style.height='auto'; });
    const h=Math.max(...list.map(t=>t.scrollHeight+2)); list.forEach(t=>{ t.style.height=h+'px'; }); };
  const groups=new Map();
  (root||document).querySelectorAll('textarea.autogrow').forEach(t=>{ const k=t.closest('.dc-pair')||t; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(t); });
  groups.forEach(list=>{ fit(list); list.forEach(t=>{ if(t._ag) return; t._ag=true; t.addEventListener('input',()=>fit(list)); }); });
}

function buildCase(f){

/* 自訂預計評核日期（同 Code.gs applyDues）：dues[i]／rdues[i][k] 空白＝沿用預設；只套用在尚未完成的評核。
   規則：不可早於該階段開始日、階段評核最晚為階段結束日後 3 個月、所有評核（含追蹤評核）需依時間順序 */
const blankD = d => d===undefined || d===null || d==='';
function duesProblem(c, dues, rdues){
  dues=dues||[]; rdues=rdues||[];
  for(let i=0;i<c.stages.length;i++){ const s=c.stages[i], d=dues[i];
    const rv=s.reviews||[];
    for(let k=0;k<rv.length;k++){ const r=rv[k], x=(rdues[i]||[])[k];
      if(blankD(x) || r.eval.locked) continue;
      if(!isDateStr(x)) return r.label+'評核日期格式錯誤';
      if(x<s.from) return r.label+'評核日期不可早於階段開始日 '+s.from; }
    if(blankD(d) || s.eval.locked) continue;
    if(!isDateStr(d)) return s.label+'評核日期格式錯誤';
    if(d<s.from) return s.label+'評核日期不可早於階段開始日 '+s.from;
    const max=fmt(addM(parseD(s.to),3)); if(d>max) return s.label+'評核日期最晚為 '+max+'（階段結束日後 3 個月）'; }
  const seq=[];
  c.stages.forEach((s,i)=>{ (s.reviews||[]).forEach((r,k)=>{ const x=(rdues[i]||[])[k]; seq.push([r.label, (!r.eval.locked && x) ? x : r.due]); });
    seq.push([s.label+'評核', (!s.eval.locked && dues[i]) ? dues[i] : s.due]); });
  for(let j=1;j<seq.length;j++) if(seq[j][1]<seq[j-1][1]) return seq[j][0]+'日期不可早於'+seq[j-1][0]+'日期（'+seq[j-1][1]+'）';
  return '';
}
function applyDues(c, dues, rdues){
  dues=dues||[]; rdues=rdues||[];
  const e=duesProblem(c,dues,rdues); if(e) throw new Error(e);
  c.stages.forEach((s,i)=>{ if(!s.eval.locked && dues[i]) s.due=dues[i];
    (s.reviews||[]).forEach((r,k)=>{ const x=(rdues[i]||[])[k]; if(!r.eval.locked && x) r.due=x; }); });
}
function buildCaseBase(f){
  const set = STAGE_SETS[f.version]; const st = parseD(f.startDate);
  const dims = f.dims.slice();
  const cad = f.version==='12m' && CADENCES[f.cadence] ? f.cadence : 'std', fm=!!CADENCES[cad].formal;
  let no=0; const nm=()=>'第'+CN[no++]+'階段';   // 5 階段評核：依時間順序命名第一～五階段

/* 清單自動接續：工作內容自動編號（1. 2. 3.），預期成果自動加「・」

  el.addEventListener('focus',()=>{ if(!el.readOnly && !el.disabled && !el.value.trim()){ el.value=first; el.setSelectionRange(el.value.length,el.value.length); fire(); } });
  el.addEventListener('blur',()=>{   // 離開時移除結尾只有編號／符號的空白項目

    let ls=v.lastIndexOf('\n',a-1)+1, line=v.slice(ls,a);

      if(!line.trim()) return;                       // 空白行：一般換行
      e.preventDefault();

      let pre;
      if(kind==='num'){ const pl=ls>0 ? v.slice(v.lastIndexOf('\n',ls-2)+1, ls-1) : ''; const pm=NUM.exec(pl);

    }

    if(!e.conclusion) return '請選擇階段結論';
    if(e.conclusion!=='通過' && !e.note.trim()) return '階段結論為「'+e.conclusion+'」時，請填寫說明';
    if(e.conclusion==='延長觀察' && part>=MAX_STAGES-1) return c.stages[part].label+'為最後的延長階段，結論請選擇「通過」或「不通過」';
    if(e.conclusion==='延長觀察' && canExtendAt(c,part)){
      if(!EXT_MONTHS.includes(Number(e.extMonths))) return '請選擇延長觀察期間（1～3 個月）';
      if(!e.extAck) return '請勾選受評人員確認延長觀察';
      if(!e.extPlan.dims.length) return '請設定延長期間的目標與工作面向';
      const xe=stagePlanProblem(Object.assign({label:'延長期間'},e.extPlan)); if(xe) return xe.replace('延長期間的「階段目標」','延長期間的目標');
    }
  }
  const [a,b]=SIGKEYS(part);
  if(!sigs[a]) return '請完成面談主管簽名';
  if(!sigs[b]) return '請完成受評人員簽名';   // 計畫書與三個階段評核皆需雙方簽名
  return '';
}

    s.reviews.forEach(r=>Object.assign(r.eval,{locked:true,lockedAt:x.date,date:x.date,paper:true,mgrName:c.manager}));   // 紙本完成的階段，其追蹤評核一併視為紙本完成

  if(ps[2].paper && ps[2].conclusion==='延長觀察') addExtStage(c,2,Number(ps[2].extMonths));
  db.cases[c.id]={c,sigs:{}}; demoLog(db,'匯入紙本計畫書',c.name,ref);

/* 人資開啟／關閉階段評核：計畫書須已簽核，且需依序開啟 */
function openStage(c,part,open){
  part=parsePart(part);
  if(isRvPart(part)){   // 5 次評核的第 1、2 個月評核（正式評核）
    const i=Number(part[1]), k=Number(part[2]), r=c.stages[i] && c.stages[i].reviews[k];
    if(!r || !rvFormal(c)) throw new Error('此評核到日期自動開放，不需人資開啟');
    if(r.eval.locked) throw new Error('此評核已完成，無法變更');
    if(open){ if(!c.plan.locked) throw new Error('職務計畫書尚未簽核，無法開啟評核');
      if(!rvReady(c,i,k)) throw new Error('請先完成前一次評核'); }
    r.eval.open=!!open; return; }
  const s=c.stages[part]; if(!s) throw new Error('階段錯誤');
  if(s.eval.locked) throw new Error('此階段評核已完成，無法變更');
  if(open){
    if(!c.plan.locked) throw new Error('職務計畫書尚未簽核，無法開啟評核');
    if(part>0 && !c.stages[part-1].eval.locked) throw new Error('請先完成'+c.stages[part-1].label+'評核');
    if(s.ext && !s.ext.plan.locked) throw new Error(s.label+'的延長計畫尚未簽核，無法開啟評核');
    const r=(s.reviews||[]).find(x=>!x.eval.locked); if(r) throw new Error('請先完成'+s.label+'的'+r.label+'評核（'+r.due+' 自動開放）');
  }
  s.eval.open=!!open;
}
/* 調整預計評核日期（同 Code.gs shiftDueCase／shiftDueCases）：只動尚未完成的階段，計畫期間不變；
   months 1～3＝在目前評核日期上延後 N 個月，0＝恢復為階段結束日；最晚到階段結束日後 3 個月 */
const DUE_SHIFT = [0,1,2,3], DUE_MAX_DELAY = 3;
const shiftedDue = (s,months) => months===0 ? s.to : fmt(addM(parseD(s.due),months));
function shiftDueCase(c, months){
  months=Number(months); if(!DUE_SHIFT.includes(months)) throw new Error('調整月數錯誤');
  let n=0;
  c.stages.forEach(s=>{
    (s.reviews||[]).forEach(r=>{ if(r.eval.locked) return; const nd=months===0 ? r.to : fmt(addM(parseD(r.due),months));
      if(nd>fmt(addM(parseD(s.to),DUE_MAX_DELAY))) throw new Error((c.name||'')+' '+r.label+'：評核日期最多只能延到階段結束日後 '+DUE_MAX_DELAY+' 個月');
      if(nd!==r.due){ r.due=nd; n++; } });
    if(s.eval.locked) return; const nd=shiftedDue(s,months);
    if(nd>fmt(addM(parseD(s.to),DUE_MAX_DELAY))) throw new Error((c.name||'')+' '+s.label+'：評核日期最多只能延到階段結束日後 '+DUE_MAX_DELAY+' 個月');
    if(nd!==s.due){ s.due=nd; n++; } });
  return n;
}
function demoShiftDue(db, ids, months){
  if(!Array.isArray(ids)||!ids.length) throw new Error('請選擇要調整的案件');
  const xs=ids.map(id=>{ const x=db.cases[id]; if(!x) throw new Error('找不到此案件'); return clone(x.c); });

/* 建立延長階段（評核選「延長觀察」送出時自動建立；同 Code.gs addExtStage） */
function addExtStage(c, i, months){
  const prev=c.stages[i], n=c.stages.length, ep=prev.eval.extPlan, [from,to]=extRange(prev,months);
  const last = ep && ep.dims && ep.dims.length ? {goal:ep.goal, dims:ep.dims, items:ep.items, eval:prev.eval} : prev;   // 有設定延長期間內容時以它為準
  c.stages.push({label:'第'+CN[rvFormal(c)?n+2:n]+'階段', range:'延長 '+months+' 個月', name:'延長觀察期', from, to, due:to, goal:last.goal, reviews:[],
    dims:last.dims.slice(), items:last.items.map(it=>({content:it.content,outcome:it.outcome})),
    eval:{ratings:last.dims.map(()=>''), comments:last.dims.map(()=>''), checks:last.dims.map(()=>[]), date:'', conclusion:'', note:'', feedback:'', locked:false, lockedAt:'', open:false, mgrName:'', paper:false, extMonths:0, extAck:false},
    ext:{months, auto:true, plan:{locked:true, lockedAt:last.eval.lockedAt||today(), signDate:last.eval.date||'', mgrName:c.manager}}});
  c.dims=unionDims(c);
}
function unlockPart(c,sigs,part){
  part=parsePart(part);
  if(isRvPart(part)){
    const s=c.stages[Number(part[1])], k=Number(part[2]), r=s && s.reviews[k];
    if(!r || !r.eval.locked) throw new Error('此追蹤評核尚未完成');
    if(s.eval.locked) throw new Error(s.label+'評核已完成，請先解鎖'+s.label+'評核');
    if(s.reviews.slice(k+1).some(x=>x.eval.locked)) throw new Error('後面的追蹤評核已完成，請先解鎖後面的追蹤評核');
    Object.assign(r.eval,{locked:false,lockedAt:'',mgrName:'',paper:false,open:true});
  } else if(isExtPart(part)){
    const s=c.stages[Number(part.slice(1))];
    if(!s || !s.ext || !s.ext.plan.locked) throw new Error('此延長計畫尚未簽核');
    if(s.eval.locked) throw new Error(s.label+'評核已完成，請先解鎖評核');
    Object.assign(s.ext.plan,{locked:false,lockedAt:'',mgrName:''}); s.eval.open=false;
  } else if(part==='plan'){
    if(c.stages.some(s=>s.eval.locked || (s.reviews||[]).some(r=>r.eval.locked))) throw new Error('已有評核完成，請先由後往前解鎖評核表');
    c.plan.locked=false; c.plan.lockedAt=''; c.plan.mgrName=''; c.plan.paper=false;
  } else {
    if(c.stages[part+1] && c.stages[part+1].eval.locked) throw new Error('下一階段已完成，請先解鎖下一階段');
    if(c.stages[part+1] && (c.stages[part+1].reviews||[]).some(r=>r.eval.locked)) throw new Error('下一階段的追蹤評核已完成，請先解鎖該追蹤評核');
    if(c.stages[part+1] && c.stages[part+1].ext){ const n=c.stages.length; c.stages.pop(); c.dims=unionDims(c); SIGKEYS(n-1).concat(SIGKEYS('x'+(n-1))).forEach(k=>delete sigs[k]); }   // 由本階段「延長觀察」建立的延長階段，一併刪除
    c.stages[part].eval.locked=false; c.stages[part].eval.lockedAt=''; c.stages[part].eval.open=true; c.stages[part].eval.mgrName=''; c.stages[part].eval.paper=false;
  }
  SIGKEYS(part).forEach(k=>delete sigs[k]);
}

/* ---------------- 狀態判斷 ---------------- */
function planStatus(c){
  if(c.plan.locked) return {t:'已簽核 '+md(c.plan.lockedAt)+(c.plan.paper?'（紙本）':''),k:'g'};
  const late = daysBetween(c.startDate,today())>14;
  const any = c.stages.some(s=>s.goal||s.items.some(i=>i.content||i.outcome));
  return {t:(any?'填寫中':'未填寫')+(late?'（逾期）':''),k:late?'r':(any?'b':'')};
}
function stageStatus(c,i){
  const s=c.stages[i];
  if(s.ext && !s.ext.plan.locked && !s.eval.locked) return {t:'延長計畫填寫中（'+s.from+' 起）',k:'a'};
  if(s.eval.locked) return {t:'已完成 '+md(s.eval.lockedAt)+(s.eval.paper?'（紙本）':''),k:'g',done:true};
  if(!c.plan.locked || (i>0 && !c.stages[i-1].eval.locked)){
    const late = daysBetween(s.due,today())>0;
    return {t:(late?'逾期 ':'到期 ')+md(s.due),k:late?'r':''};
  }
  const d = daysBetween(today(), s.due);
  if(d<0) return {t:'逾期 '+(-d)+' 天',k:'r'};
  if(d<=14) return {t:'剩 '+d+' 天（'+md(s.due)+'）',k:'a'};
  return {t:'到期 '+md(s.due),k:''};
}
function caseDone(c){ return c.stages.every(s=>s.eval.locked); }
/* 案件整體狀態（人資「主管連結管理」與主管工作清單共用）
   todo 尚未填寫｜draft 填寫中｜eval 待評核（追蹤評核已開放或人資已開啟階段評核）｜wait 等待評核開啟｜done 已完成 */
const CSTATE = {todo:{t:'尚未填寫',k:'',ic:'file'}, draft:{t:'填寫中',k:'b',ic:'edit'}, ext:{t:'待訂延長計畫',k:'a',ic:'edit'}, eval:{t:'待評核',k:'p',ic:'flag'}, wait:{t:'等待評核開啟',k:'',ic:'clock'}, done:{t:'已完成',k:'g',ic:'checkc'}};
function planTouched(c){ return c.stages.some(s=>s.goal.trim() || s.dims.length || s.items.some(i=>i.content.trim()||i.outcome.trim())); }
function caseState(c){
  if(!c.plan.locked) return planTouched(c) ? 'draft' : 'todo';
  const x=nextItem(c); if(!x) return 'done';
  if(x.rv) return rvOpen(c,x.i,x.k) ? 'eval' : 'wait';
  if(x.s.ext && !x.s.ext.plan.locked) return 'ext';
  return x.s.eval.open ? 'eval' : 'wait';
}
/* 整體進度：計畫書＋各次評核（含追蹤評核）各算一份 */
function evalUnits(c){ const T=timeline(c); return {n:T.length, d:T.filter(itemDone).length}; }
function caseProgress(c){
  const sd=k=>{ const s=c.stages[k]; return s.dims.length>=MIN_DIMS && s.dims.length<=MAX_DIMS && s.dims.every(x=>String(x).trim()) && !!s.goal.trim() && s.items.every(it=>it.content.trim()&&it.outcome.trim()); };
  let u = c.plan.locked ? 1 : ([0,1,2].filter(sd).length + (ivProblems(c.plan.interview).length?0:1))/5*0.95;
  const E=evalUnits(c); u += E.d; return Math.round(u/(1+E.n)*100);
}
/* 追蹤評核狀態（人資列表、主管清單共用） */
function rvStatus(c,i,k){
  const r=c.stages[i].reviews[k];
  if(r.eval.locked) return {t:'已完成 '+md(r.eval.lockedAt)+(r.eval.paper?'（紙本）':''),k:'g',done:true};
  if(!rvReady(c,i,k)) return {t:'預計 '+md(r.due)+(rvFormal(c)?'':' 開放'),k:''};
  const d=daysBetween(today(),r.due);
  if(rvFormal(c)){   // 正式評核：與階段評核相同，由人資開啟、過了預計日即逾期
    const k2=d<0?'r':(d<=HR_LOOKAHEAD?'a':''), dt=d<0?`逾期 ${-d} 天`:d<=HR_LOOKAHEAD?`剩 ${d} 天`:'預計 '+md(r.due);
    return r.eval.open ? {t:'評核中｜'+dt,k:k2||'p',open:true} : {t:'待人資開啟｜'+dt,k:k2}; }
  if(d>0) return {t:(d<=14?`${d} 天後開放`:'預計 '+md(r.due)+' 開放'),k:d<=14?'a':''};
  const late=-d>RV_GRACE; return {t:late?`逾期 ${-d-RV_GRACE} 天`:'填寫中｜開放 '+md(r.due),k:late?'r':'p',open:true};

/* 已簽核文件顯示「簽核當時」的面談主管；尚未簽核顯示目前負責主管 */
function signerName(c, part){
  if(part==='plan') return c.plan.locked ? (c.plan.mgrName||c.manager) : c.manager;
  if(isRvPart(part)){ const e=rvOf(c,part).eval; return e.locked ? (e.mgrName||c.manager) : c.manager; }
  if(isExtPart(part)){ const x=c.stages[Number(part.slice(1))].ext.plan; return x.locked ? (x.mgrName||c.manager) : c.manager; }
  const e=c.stages[part].eval; return e.locked ? (e.mgrName||c.manager) : c.manager;

/* ---------------- 現在輪到誰（主管端、人資端共用；階段 1 新增） ----------------
   whoseTurn(c[, mgr]) → {who, reason}
   who：hr 需要人資處理｜mgr 等待主管填寫｜none 等待中（不需任何人動作）｜done 已完成
   純函式：只讀案件（與選填的主管物件），不存任何狀態；判斷重用 caseDone／nextItem／rvOpen／evalReady／canExtend。
   mgr：人資端可傳入 Admin.mgrOf(c)。傳入 null＝主管清單找不到；主管連結已撤銷時也歸給人資（待確認）。主管端不需傳。 */
const HR_LOOKAHEAD = 14;   // 預計評核日前幾天（含逾期）提醒人資開啟階段評核
function whoseTurn(c, mgr){
  if(!c.managerId || mgr===null) return {who:'hr', reason:'尚未指派主管'};
  if(mgr && mgr.tokenStatus!=='active') return {who:'hr', reason:'主管連結已撤銷'};
  if(canExtend(c)) return {who:'hr', reason:'可新增延長階段'};   // 舊資料用；須排在「已完成」之前，否則永遠判斷不到
  if(caseDone(c)) return {who:'done', reason:'已完成簽核'};
  if(!c.plan.locked) return {who:'mgr', reason:'計畫書填寫／面談／簽名中'};
  const x=nextItem(c);
  if(x.rv && rvFormal(c)){   // 5 次評核的第 1、2 個月：與階段評核相同規則
    if(x.r.eval.open) return {who:'mgr', reason:'評核填寫中'};
    return daysBetween(today(), x.r.due)<=HR_LOOKAHEAD ? {who:'hr', reason:'該開啟評核了'} : {who:'none', reason:'尚未到時間'}; }
  if(x.rv) return rvOpen(c,x.i,x.k) ? {who:'mgr', reason:'追蹤評核填寫中'} : {who:'none', reason:'等待自動開放（人資不用動作）'};
  const s=x.s;
  if(s.ext && !s.ext.plan.locked) return {who:'mgr', reason:'主管訂定延長計畫中'};
  if(s.eval.open) return {who:'mgr', reason:'階段評核填寫中'};
  if(evalReady(c,x.i) && daysBetween(today(), s.due)<=HR_LOOKAHEAD) return {who:'hr', reason:'該開啟評核了'};
  return {who:'none', reason:'尚未到時間'};
}

  },
  /* ---------- 主管與連結 ---------- */
  mgr(id){ return this.mgrs.find(m=>m.id===id) || null; },
  mgrOf(c){ return this.mgr(c.managerId); },

  sortedMgrs(){ return this.mgrs.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant')||a.empNo.localeCompare(b.empNo)); },
  mgrLabel(m){ return `${m.name}（${m.empNo}）${m.dept?'｜'+m.dept:''}`; },
  needLink(c){ const m=this.mgrOf(c);
    if(!m){ toast('此案件尚未指派負責主管，請先「更換負責主管」'); return ''; }

    return mgrUrl(m); },
  bucket(c){ return !c.plan.locked ? 'draft' : (caseDone(c) ? 'done' : 'eval'); },
  overall(c){
    if(!c.plan.locked){ const ps=planStatus(c); return {t:'計畫填寫中',k:ps.k==='r'?'r':'b',next:'職務計畫書｜'+ps.t}; }
    const i=c.stages.findIndex(s=>!s.eval.locked);
    if(i<0){ const l=c.stages[c.stages.length-1];
      if(canExtend(c)) return {t:'結論：延長觀察',k:'a',next:`${l.label}結論為延長觀察｜可新增延長階段`};

    const s=c.stages[i], rk=(s.reviews||[]).findIndex(r=>!r.eval.locked);
    if(rk>=0){ const r=s.reviews[rk], st=rvStatus(c,i,rk);

        : {t:r.label+'評核待開啟',k:st.k,next:`${r.label}評核｜預計評核日 ${r.due}｜${rvReady(c,i,rk)?'待人資開啟':'須先完成前一次評核'}`};
      return st.open ? {t:r.label+'評核中',k:st.k,next:`${s.label}｜${r.label}評核｜${st.t}（${r.due} 自動開放，主管填寫中）`}
        : {t:r.label+'待開放',k:st.k,next:`${s.label}｜${r.label}評核｜${r.due} 自動開放，人資不需操作`}; }
    if(s.ext && !s.ext.plan.locked) return {t:s.label+'延長計畫填寫中',k:'a',next:`主管訂定延長計畫中（延長 ${s.ext.months} 個月，${s.from} ～ ${s.to}）`};
    if(!s.eval.open){ const d=daysBetween(today(),s.due); return {t:s.label+'待開啟',k:d<0?'r':(d<=14?'a':''),next:`${s.ext?`延長 ${s.ext.months} 個月｜`:''}預計評核日 ${s.due}${d<0?'（已逾期）':d<=14?`（剩 ${d} 天）`:''}｜待人資開啟`}; }
    const st=stageStatus(c,i); return {t:s.label+'評核中',k:st.k==='r'?'r':(st.k==='a'?'a':'p'),next:s.label+'評核｜'+st.t};
  },
  /* 下一個可由人資開啟／關閉的階段 */
  nextStage(c){ if(!c.plan.locked) return -1; return c.stages.findIndex(s=>!s.eval.locked); },
  /* 下一個由人資開啟／關閉的評核：{p:表單代號, label, due, open, ready}；沒有則 null */
  nextOpen(c){ const x=nextItem(c); if(!x) return null;

      c.stages.map((s,i)=>(s.reviews||[]).map((r,k)=>{ const st=rvStatus(c,i,k); return seg(rvFormal(c)?shortLabel(r.label):r.month+'月', st.k, r.label+'（'+rvKind(c)+'）：'+st.t); }).join('') +
        (()=>{ const st=stageStatus(c,i); const k = st.done?'g' : !s.eval.open ? (st.k==='r'?'r':'') : (st.k||'p');
        return seg(shortLabel(s.label)+(s.ext?'延':''), k, s.label+(s.ext?'（延長）':'')+'：'+(st.done?st.t:(s.eval.open?'評核中｜':'未開啟｜')+st.t)); })()).join('');
  },
  pbar(c){ const p=caseProgress(c); return `<div class="pbar"><div class="bar sm"><i style="width:${p}%"></i></div><b>${p}%</b></div>`; },

    const stat=(key,val,cls,icon,num,label)=>`<button class="stat ${key&&f[key]===val?'on':''} ${key?'':'static'}" ${key?`data-mk="${key}" data-mv="${val}"`:''}><span class="si ${cls}">${ic(icon,22)}</span><span><span class="sn">${num}</span><br><span class="sl">${label}</span></span></button>`;
    $('#tabBody').innerHTML = `
    <div class="stats">
      ${stat('link','','c0','users',M.length,'主管總人數')}
      ${stat('link','active','c3','link',active,'已建立有效專屬連結')}
      ${stat('prog','pending','c2','clock',pend,'尚有待處理案件的主管')}
      ${stat('','', 'c1','file',undone,'所有案件中尚未完成')}
    </div>
    ${un?`<div class="alerts"><button class="alert r" id="goUn">${ic('user')} ${un} 件案件尚未指派負責主管，點此前往指派</button></div>`:''}
    <div class="card" style="padding:14px 18px">
      <div class="toolbar" style="margin:0">
        <div class="search">${ic('search')}<input id="mq" placeholder="搜尋主管姓名、員工編號或受評人員姓名" value="${esc(f.q)}"></div>
        <select id="md"><option value="">全部部門</option>${depts.map(d=>`<option ${f.dept===d?'selected':''}>${esc(d)}</option>`).join('')}</select>
        <select id="ml">${[['','全部連結狀態'],['active','連結有效'],['revoked','連結已撤銷']].map(o=>`<option value="${o[0]}" ${f.link===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
        <select id="mp">${[['','全部案件進度'],['pending','有待處理案件'],['eval','有待評核案件'],['alldone','案件皆已完成'],['none','尚無負責案件']].map(o=>`<option value="${o[0]}" ${f.prog===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
        <select id="ms">${[['name','依主管姓名排序'],['dept','依部門排序']].map(o=>`<option value="${o[0]}" ${f.sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
      </div>
    </div>
    <div class="mlist" id="mlist"></div>`;
    document.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{ const k=b.dataset.mk, v=b.dataset.mv; f[k] = (f[k]===v && v) ? '' : v; if(k==='link' && !v) { f.link=''; f.prog=''; } this.render(); });
    if($('#goUn')) $('#goUn').onclick=()=>{ this.filter.mgr='none'; this.setTab('cases'); };
    $('#mq').oninput=e=>{ f.q=e.target.value; this.mcards(); };
    $('#md').onchange=e=>{ f.dept=e.target.value; this.mcards(); };
    $('#ml').onchange=e=>{ f.link=e.target.value; this.render(); };
    $('#mp').onchange=e=>{ f.prog=e.target.value; this.render(); };
    $('#ms').onchange=e=>{ f.sort=e.target.value; this.mcards(); };
    this.mcards();
  },
  mcards(){
    const f=this.mf, q=f.q.trim();
    let M=this.mgrs.filter(m=>{
      const n=this.mstat(m);
      if(f.dept && m.dept!==f.dept) return false;
      if(f.link && m.tokenStatus!==f.link) return false;
      if(f.prog==='pending' && !n.undone) return false;
      if(f.prog==='eval' && !(n.eval+n.wait+n.ext)) return false;
      if(f.prog==='alldone' && !(n.all && !n.undone)) return false;
      if(f.prog==='none' && n.all) return false;
      if(q && ![m.name,m.empNo].join(' ').includes(q) && !this.mgrCases(m).some(c=>c.name.includes(q))) return false;
      return true;
    });
    const byName=(a,b)=>a.name.localeCompare(b.name,'zh-Hant')||a.empNo.localeCompare(b.empNo);
    M.sort(f.sort==='dept' ? (a,b)=>(a.dept||'～').localeCompare(b.dept||'～','zh-Hant')||byName(a,b) : byName);
    const el=$('#mlist');
    if(!M.length){ el.innerHTML=`<div class="card"><div class="empty">${ic('users',32)}<br>${this.mgrs.length?'沒有符合條件的主管':'尚無主管資料，請按右上角「新增主管」，或在新增案件時一併建立'}</div></div>`; return; }
    el.innerHTML=M.map(m=>this.mcardHTML(m, q)).join('');
    el.onclick=e=>{ const b=e.target.closest('[data-ma]'); if(!b) return; const m=this.mgr(b.closest('[data-mid]').dataset.mid); this.mgrAction(m,b.dataset.ma,b); };
  },
  mcardHTML(m, q){

    const box=(cls,num,l)=>`<div class="mbox ${cls}"><span class="n">${num}</span><span class="l">${l}</span></div>`;
    const C=this.mgrCases(m);
    return `<div class="mcard ${on?'':'revoked'}" data-mid="${m.id}">
      <div class="mc-top">
        <div class="mc-who"><span class="avatar lg">${esc(m.name.charAt(0))}</span>
          <div style="min-width:0"><div class="row"><b>${esc(m.name)}</b><span class="chip">${esc(m.empNo)}</span></div>
            <div class="mut">${esc(m.dept)||'—'}｜${esc(m.title)||'—'}</div>
            <div class="row" style="margin-top:4px"><span class="chip ${on?'g':'r'}">${ic(on?'link':'xc',12)}${on?'專屬連結有效':'連結已撤銷'}</span><span class="mut">負責 ${n.all} 件</span></div></div></div>
        <div class="mc-sum">${box('z',n.all,'負責案件')}${box('g',n.done,'已完成')}${box('b',n.draft,'填寫中')}${box('',n.todo,'尚未填寫')}${box('p',n.eval+n.wait+n.ext,'階段評核中')}</div>
      </div>
      <div class="mc-link">
        ${on?`<input class="lk" readonly value="${esc(url)}" onclick="this.select()" aria-label="主管專屬連結">
          <button class="btn t s" data-ma="copy">${ic('copy')}複製連結</button>
          <button class="btn o s" data-ma="open">${ic('external')}查看連結</button>
          <button class="btn o s" data-ma="regen">${ic('layers')}重新產生</button>
          <button class="btn r s" data-ma="revoke">${ic('xc')}撤銷</button>`
        :`<span class="lkoff">${ic('warn')}連結已撤銷，主管目前無法進入填寫專區。</span><button class="btn t s" data-ma="regen">${ic('link')}重新產生連結</button>`}
      </div>
      <div class="mc-ft">
        <button class="btn o s tgl ${open?'on':''}" data-ma="toggle" ${C.length?'':'disabled'}>${ic('right')}${open?'收合':'展開'}所屬受評人員（${C.length}）</button>
        <span class="spacer"></span>
        <button class="btn o s" data-ma="edit">${ic('edit')}編輯主管資料</button>
        <button class="btn o s" data-ma="manage" ${C.length?'':'disabled'}>${ic('users')}管理負責案件</button>
        <button class="btn o s" data-ma="all" ${C.length?'':'disabled'}>${ic('grid')}查看所有案件</button>
        <button class="iconbtn" data-ma="more" title="更多操作">${ic('more',18)}</button>
      </div>
      ${open && C.length?`<div class="mc-body">${this.mcasesHTML(C)}</div>`:''}
    </div>`;
  },
  mcasesHTML(C){
    return `<table class="list"><thead><tr><th>受評人員</th><th>類型</th><th>職務計畫書</th><th>階段評核</th><th>整體進度</th><th style="text-align:right">操作</th></tr></thead><tbody>
      ${C.map(c=>{ const st=CSTATE[caseState(c)], ps=planStatus(c);

  mgrAction(m, a, btn){

  async regenDlg(m){
    const on=m.tokenStatus==='active';
    const ok=await Dialog.confirm({title:(on?'重新產生':'恢復')+'專屬連結｜'+esc(m.name),icon:'link',danger:on,ok:'產生新連結',
      body: on?`產生新連結後，<b>原本的連結會立即失效</b>，${esc(m.name)} 必須改用新連結。<br>適用於連結外流或誤傳給他人的情況。`
              :`將為 ${esc(m.name)} 產生新的專屬連結，原本被撤銷的連結仍維持失效。`});
    if(!ok) return;
    try{ const r=await api('adminMgrToken',{key:this.key,mid:m.id}); await this.load(); this.linkDlg(r,'已產生新連結',`${on?'舊連結已失效。':''}請把新連結傳給 <b>${esc(r.name)}</b>：`); }catch(e){ toast(e.message,3200); }

      body:`撤銷後連結<b>立即失效</b>，${esc(m.name)} 將無法進入填寫專區。<br>負責的 ${n.all} 件案件與已填寫內容都會保留，之後可以「重新產生連結」恢復使用。`});
    if(!ok) return;
    try{ await api('adminMgrRevoke',{key:this.key,mid:m.id}); toast('已撤銷連結'); this.load(); }catch(e){ toast(e.message,3200); }
  },
  async delMgr(m){
    if(this.mgrCases(m).length) return toast('此主管仍有負責案件，請先用「管理負責案件」改派給其他主管',3600);
    const ok=await Dialog.confirm({title:'刪除主管｜'+esc(m.name),icon:'trash',danger:true,ok:'刪除',body:`確定要刪除 ${esc(m.name)}（${esc(m.empNo)}）的主管資料？專屬連結會一併失效。`});
    if(!ok) return;
    try{ await api('adminMgrDelete',{key:this.key,mid:m.id}); toast('已刪除主管'); this.load(); }catch(e){ toast(e.message,3200); }

  /* ---------- 負責主管選擇器（新增／複製案件、更換主管共用） ---------- */

  readPicker(){

  /* ---------- 調整預計評核日期（批次；後端 adminShiftDue） ----------
     只調整尚未完成的階段評核日期（stages[i].due），計畫期間不變；已完成（含紙本完成）的階段不受影響 */
  dueSel: null, dueM: 1,
  dueDlg(pre){

    else if(!this.dueSel) this.dueSel=new Set();

      <div class="dlg-bd">
        <div class="tip">${ic('info')}<span>只調整<b>尚未完成</b>的預計評核日期（含追蹤評核）；各階段計畫期間不變，已完成（含紙本完成）的評核不受影響。評核日期最晚可延到階段結束日後 ${DUE_MAX_DELAY} 個月。</span></div>
        <div class="sub-hd" style="margin-top:4px">調整方式</div>
        <div class="optlist" style="flex-direction:row;flex-wrap:wrap">${opt(1,'延後 1 個月')}${opt(2,'延後 2 個月')}${opt(3,'延後 3 個月')}${opt(0,'恢復為階段結束日')}</div>
        <div class="sub-hd">選擇案件 <span class="mut" id="dueCnt"></span></div>
        <div class="row" style="margin-bottom:8px">${imp.length?`<button class="btn o s" id="dueImp">${ic('inbox',14)}全選紙本匯入案件（${imp.length}）</button>`:''}
          <button class="btn o s" id="dueAll">全選</button><button class="btn o s" id="dueNone">全不選</button></div>
        <div class="optlist" style="max-height:26vh;overflow:auto">${L.map(c=>`<label><input type="checkbox" class="dueC" value="${c.id}" ${this.dueSel.has(c.id)?'checked':''}>
          <span><b>${esc(c.name)}</b> ${typeTag(c.type)}${c.importRef?' <span class="chip">紙本匯入</span>':''}<br><span class="mut">${esc(c.manager)||'未指派'}｜${timeline(c).filter(x=>!itemDone(x)).map(x=>x.rv?`${x.r.month}月追蹤 ${x.r.due}`:`${CN[x.i]} ${x.s.due}`).join('、')}</span></span></label>`).join('')}</div>
        <div class="sub-hd">調整預覽</div><div id="duePv"></div>
      </div>
      <div class="dlg-ft"><button class="btn o" data-close>取消</button><button class="btn t" id="dueGo">${ic('check')}確認調整</button></div>`,{wide:true});
    const sync=()=>{ this.dueSel=new Set([...document.querySelectorAll('.dueC:checked')].map(x=>x.value)); this.dueM=Number(document.querySelector('input[name=dueM]:checked').value); this.duePreview(L); };
    document.querySelectorAll('.dueC,input[name=dueM]').forEach(x=>x.onchange=sync);
    const pick=f=>{ document.querySelectorAll('.dueC').forEach(x=>{ x.checked=f(L.find(c=>c.id===x.value)); }); sync(); };
    if($('#dueImp')) $('#dueImp').onclick=()=>pick(c=>!!c.importRef);
    $('#dueAll').onclick=()=>pick(()=>true); $('#dueNone').onclick=()=>pick(()=>false);
    sync();
    $('#dueGo').onclick=async()=>{
      const ids=[...this.dueSel], m=this.dueM;
      if(!ids.length) return toast('請勾選要調整的案件');

  /* ---------- 匯入紙本職務計畫書 ----------
     匯入檔（JSON，由 Claude 依紙本 PDF 轉出，不含個人資料）格式：
     {"format":"jpt-import-v1","plans":[{"ref":"案件A","type":"新進","version":"12m","jobTitle":"會計專員","dept":"財務部","signDate":"2026-10-15",
       "stages":[{"goal":"…","dims":["…"],"items":[["工作內容","預期成果"],…]}, {…}, {…}]}]}
     姓名、生效日、負責主管、紙本評核完成情形由人資在此視窗填寫 */
  imp: null, impSel: 0,
  parseImport(txt){
    let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('檔案不是有效的匯入檔（JSON 格式錯誤）'); }
    const plans = Array.isArray(j.plans) ? j.plans : (j.stages ? [j] : null);
    if(!plans || !plans.length) throw new Error('匯入檔中沒有職務計畫書資料');
    plans.forEach((p,k)=>{ const nm=p.ref||('第 '+(k+1)+' 份');
      if(!Array.isArray(p.stages) || p.stages.length!==3) throw new Error(nm+'：需要三個階段');
      p.stages.forEach((s,i)=>{ if(!Array.isArray(s.dims)||!s.dims.length||!Array.isArray(s.items)||s.items.length!==s.dims.length) throw new Error(nm+'：第'+(i+1)+'階段的工作面向與內容不一致'); });
      if(!TYPES.includes(p.type)) p.type='新進'; if(!STAGE_SETS[p.version]) p.version='12m'; });
    return plans;
  },
  /* 匯入視窗重繪時保留已填內容（取消確認或匯入失敗時不必重填） */

  impKey(el){ return el.id || ((el.classList[0]||'')+':'+(el.dataset.i||'')+(el.dataset.k||'')+':'+(el.name||'')); },
  impSnap(){ const o={}; document.querySelectorAll('#modal input,#modal select').forEach(el=>{ if(el.type==='file'||el.name==='impSel') return; o[this.impKey(el)]=el.type==='checkbox'?el.checked:el.value; }); return o; },
  impRestore(v,onlyDue){ document.querySelectorAll('#modal input,#modal select').forEach(el=>{ const k=this.impKey(el);
      const isDue=el.classList.contains('f_due')||el.classList.contains('f_rdue');
      if(!(k in v) || isDue!==!!onlyDue) return;
      if(el.type==='checkbox') el.checked=v[k]; else el.value=v[k];
      if(onlyDue) el.closest('.dfl').classList.toggle('chg',el.value!==el.dataset.def); }); },

  },

  /* 讀取評核日期欄（未修改＝空白，沿用預設）；回傳 {dues, rdues} 或 null（有空白欄） */
  readDueGrid(pre){

    R.forEach(x=>{ const i=Number(x.dataset.i); (rdues[i]=rdues[i]||[])[Number(x.dataset.k)]=v(x); });

/* =====================================================================
   主管工作清單（主管專屬連結 ?m=主管連結碼）
   ===================================================================== */
var MgrHome; MgrHome = {
  token:'', m:null, cases:[], f:'all', q:'',
  init(token, caseId){
    this.token=token; $('#roleTxt').textContent='主管填寫端';
    window.addEventListener('popstate',()=>this.onPop());
    if(caseId){ history.replaceState({},'',this.url(caseId)); Manager.init(caseId, token); } else this.load();
  },
  url(id){ return baseUrl()+'?m='+encodeURIComponent(this.token)+(id?'&c='+encodeURIComponent(id):''); },
  onPop(){
    const q=new URLSearchParams(location.search);
    if(Manager.active && Manager.dirty){ history.pushState({},'',this.url(Manager.id)); Manager.backToList(); return; }
    if(q.get('c')) Manager.init(q.get('c'), this.token); else this.load();
  },
  open(id){ history.pushState({},'',this.url(id)); Manager.init(id, this.token); window.scrollTo(0,0); },
  back(){ history.pushState({},'',this.url()); this.load(); window.scrollTo(0,0); },
  async load(){
    Manager.active=false; $('#topRight').innerHTML='';
    $('#app').innerHTML='<div class="loading">載入中…</div>';
    try{ const r=await api('mgrList',{token:this.token}); this.m=r.m; this.cases=r.cases; }
    catch(e){ $('#app').innerHTML=`<div class="card" style="max-width:520px;margin:60px auto"><div class="dlg-hd danger"><span class="dlg-ic">${ic('warn',20)}</span><h2 style="margin:0">無法開啟</h2></div>${esc(e.message)}<br><span class="mut">請確認連結是否完整，或洽人資部取得最新的主管專屬連結。</span></div>`; return; }
    this.render();
  },
  /* ---- 職務計畫書目前步驟（依實際資料判斷，不另存狀態）----
     fill 填寫中：三個階段的計畫內容尚未填完｜talk 待面談：計畫內容已填完、面談紀錄與員工回饋尚未完成｜
     sign 待簽名：面談紀錄已完成、尚未雙方簽名送出｜done 已完成：雙方簽名並送出（鎖定） */
  planStep(c){
    if(c.plan.locked) return {k:'done', n:3};
    const sd=k=>{ const s=c.stages[k]; return s.dims.length>=MIN_DIMS && s.dims.length<=MAX_DIMS && s.dims.every(x=>String(x).trim()) && !!s.goal.trim() && s.items.every(it=>it.content.trim()&&it.outcome.trim()); };
    const n=[0,1,2].filter(sd).length;
    if(n<3) return {k:'fill', n};
    return ivProblems(c.plan.interview).length ? {k:'talk', n} : {k:'sign', n};
  },
  /* ---- 進度卡片：職務計畫書＋各階段（追蹤評核併入所屬階段）；k：ok 已完成｜cur 目前進行步驟｜idle 尚未開始 ---- */
  planCard(c){
    const P=this.planStep(c);
    if(P.k==='done') return {k:'ok', ic:'checkc', t:'已完成', d:'雙方簽名完成｜'+md(c.plan.lockedAt)+(c.plan.paper?'（紙本）':'')};
    if(P.k==='fill') return {k:'cur', ic:'edit', t:'進行中', d:planTouched(c)?`計畫內容已完成 ${P.n} / 3 個階段`:'尚未開始填寫'};
    if(P.k==='talk') return {k:'cur', ic:'chat', t:'待面談', d:'計畫內容已填寫完成'};
    return {k:'cur', ic:'pen', t:'待簽名', d:'面談紀錄已完成，待雙方簽名'};
  },
  stageCard(c,i){
    const fm=rvFormal(c), s=c.stages[i], rv=fm?[]:(s.reviews||[]), rvDone=rv.filter(r=>r.eval.locked).length, rvTx=rv.length?`追蹤評核 ${rvDone} / ${rv.length}｜`:'';
    if(s.eval.locked) return {k:'ok', ic:'checkc', t:'已完成', d:(rv.length?`含追蹤評核 ${rv.length} 次｜`:'')+'完成 '+md(s.eval.lockedAt)+(s.eval.paper?'（紙本）':'')};
    const nx=nextItem(c);
    if(!nx || nx.i!==i || (fm && nx.rv)) return {k:'idle', ic:'clock', t:'尚未開始', d:(rv.length?`含追蹤評核 ${rv.length} 次｜`:'')+'預計評核 '+md(s.due)};
    if(nx.rv){ const r=nx.r;
      if(rvFormal(c)){ const d=daysBetween(today(),r.due);
        return rvOpen(c,i,nx.k) ? {k:'cur'+(d<0?' late':''), ic:'flag', t:d<0?'已逾期':'待評核', d:`${r.label}評核｜期限 ${md(r.due)}${d<0?`｜逾期 ${-d} 天`:''}`}
          : {k:'cur', ic:'clock', t:'進行中', d:`${r.label}評核 預計 ${md(r.due)}，待人資開啟`}; }
      if(rvOpen(c,i,nx.k)){ const late=daysBetween(r.due,today())>RV_GRACE; return {k:'cur'+(late?' late':''), ic:'flag', t:late?'已逾期':'待評核', d:`${r.label}｜${md(r.due)} 已開放`}; }
      return {k:'cur', ic:'clock', t:'進行中', d:`${rvTx}${r.label} ${md(r.due)} 開放`}; }
    if(s.ext && !s.ext.plan.locked) return {k:'cur', ic:'edit', t:'待訂延長計畫', d:`延長 ${s.ext.months} 個月｜${md(s.from)} 起`};
    if(s.eval.open && evalReady(c,i)){ const d=daysBetween(today(),s.due);
      return d<0 ? {k:'cur late', ic:'flag', t:'已逾期', d:`${rvTx}逾期 ${-d} 天（${md(s.due)}）`} : {k:'cur', ic:'flag', t:'待評核', d:`${rvTx}期限 ${md(s.due)}${d<=14?`｜剩 ${d} 天`:''}`}; }
    return {k:'cur', ic:'clock', t:'進行中', d:`${rvTx}預計評核 ${md(s.due)}，待人資開啟`};
  },
  /* ---- 目前待辦（tx）與操作按鈕（b）；kind：act 需處理｜late 已逾期｜idle 目前無待辦。按鈕一律開啟該人員的填寫頁，系統會自動帶到目前應處理的步驟 ---- */
  /* 5 階段評核的第一、二階段（階段中的正式評核）進度卡片 */
  rvCard(c,i,k){
    const r=c.stages[i].reviews[k], nx=nextItem(c), d=daysBetween(today(),r.due);
    if(r.eval.locked) return {k:'ok', ic:'checkc', t:'已完成', d:'完成 '+md(r.eval.lockedAt)+(r.eval.paper?'（紙本）':'')};
    if(!nx || nx.p!=='r'+i+k) return {k:'idle', ic:'clock', t:'尚未開始', d:'預計評核 '+md(r.due)};
    if(rvOpen(c,i,k)) return d<0 ? {k:'cur late', ic:'flag', t:'已逾期', d:`逾期 ${-d} 天（${md(r.due)}）`} : {k:'cur', ic:'flag', t:'待評核', d:`期限 ${md(r.due)}${d<=14?`｜剩 ${d} 天`:''}`};
    return {k:'cur', ic:'clock', t:'進行中', d:`預計評核 ${md(r.due)}，待人資開啟`};
  },
  todo(c){
    const st=caseState(c), i=c.stages.findIndex(s=>!s.eval.locked), s=c.stages[i], nx=nextItem(c);
    if(!c.plan.locked){ const P=this.planStep(c);
      if(P.k==='fill') return {kind:'act', lab:'目前待辦', tx:'請完成職務計畫書填寫。', b:['t','edit','進入職務計畫書']};
      if(P.k==='talk') return {kind:'act', lab:'目前待辦', tx:'請與員工進行職務計畫書面談，並完成面談紀錄與員工回饋。', b:['t','chat','進行面談確認']};
      return {kind:'act', lab:'目前待辦', tx:'請完成面談紀錄及雙方簽名，確認後送出職務計畫書。', b:['t','pen','完成面談簽名']}; }
    if(nx && nx.rv && rvFormal(c)){ const r=nx.r, d=daysBetween(today(),r.due);
      if(st==='eval') return {kind:d<0?'late':'act', lab:'目前待辦', tx:`請完成${r.label}評核面談，並完成雙方簽名（期限 ${r.due}${d<0?`，已逾期 ${-d} 天`:d<=14?`，剩 ${d} 天`:''}）。`, b:['t','flag',`進入${r.label}評核`]};
      return {kind:'idle', lab:'目前無待辦', tx:`${r.label}評核預計於 ${r.due} 進行，屆時人資會通知您並開啟評核。`, b:['o','file','查看職務計畫']}; }
    if(nx && nx.rv){ const r=nx.r, late=daysBetween(r.due,today())>RV_GRACE;
      if(st==='eval') return {kind:late?'late':'act', lab:'目前待辦', tx:`請完成${s.label}${r.label}面談與評核（${r.due} 已開放${late?`，已超過 ${RV_GRACE} 天`:''}），並完成雙方簽名。`, b:['t','flag',`進入${s.label}評核`]};
      return {kind:'idle', lab:'目前無待辦', tx:`${s.label}的${r.label}評核將於 ${r.due} 自動開放，屆時請與受評人員面談並完成評核。`, b:['o','file','查看職務計畫']}; }
    if(st==='ext') return {kind:'act', lab:'目前待辦', tx:`${c.stages[i-1].label}結論為延長觀察，請訂定${s.label}延長計畫（延長 ${s.ext.months} 個月，${s.from} 起），並與受評人員雙方簽名確認。`, b:['t','edit','訂定延長計畫']};
    if(st==='eval'){ const d=daysBetween(today(),s.due);
      return {kind:d<0?'late':'act', lab:'目前待辦', tx:`請完成${s.label}面談與職務評核（期限 ${s.due}${d<0?`，已逾期 ${-d} 天`:d<=14?`，剩 ${d} 天`:''}）。`, b:['t','flag',`進入${s.label}評核`]}; }
    if(st==='wait') return {kind:'idle', lab:'目前無待辦', tx: s.ext ? `${s.label}（延長 ${s.ext.months} 個月）評核預計於 ${s.due} 進行，屆時人資會通知您並開啟評核。` : `職務計畫書已完成。${s.label}評核預計於 ${s.due} 進行，屆時人資會通知您並開啟評核。`, b:['o','file','查看職務計畫']};
    return {kind:'idle', lab:'已全部完成', tx: canExtend(c) ? `${c.stages[c.stages.length-1].label}結論為延長觀察，待人資建立延長階段。` : '所有計畫及評核事項皆已完成。', b:['o','checkc','查看完成紀錄']};
  },
  /* 相容：其他地方若呼叫 next／btn 仍可使用 */
  next(c){ return this.todo(c).tx; },
  btn(c){ return this.todo(c).b; },
  period(c){
    const ext=c.stages.slice(BASE_STAGES).reduce((a,s)=>a+(s.ext?s.ext.months:0),0);
    return {len:(VER_LEN[c.version]||'12 個月')+(ext?`＋延長 ${ext} 個月`:''), rng:`${c.startDate} ～ ${c.stages[c.stages.length-1].to}`};
  },
  planDocOpen(){ try{ return localStorage.getItem('jpt_plandoc')!=='0'; }catch(e){ return true; } },
  /* 人員職務計畫執行流程：固定的標準作業順序（不套用任何人員的實際狀態） */
  FLOW: [

    ['g','chat','與員工面談對焦','確認工作內容與目標','主管與員工進行面談，逐項確認工作內容、職責範圍及工作目標，確保雙方對職務要求有一致認知。'],

    const chip=(f,label,num)=>`<button class="fchip ${this.f===f?'on':''}" data-f="${f}">${label}<span class="n">${num}</span></button>`;
    $('#app').innerHTML=`
    <section class="pagehd"><div><h2>人員培育與職務追蹤平台</h2>
      <div class="mgr-intro"><p><b>${esc(this.m.name)}</b> 主管您好，當員工有新進、職務調動或晉升等情況時，人資將依個別人員的安排，請主管協助完成職務計畫書及階段性評核。</p>
      <p>透過分階段設定工作目標、確認執行情形及評估工作表現，協助員工逐步熟悉職務內容並達成任職目標。</p></div></div></section>
    <details class="plandoc" id="planDoc" ${this.planDocOpen()?'open':''}>
      <summary>${ic('info',18)}計畫說明<span class="tg">展開／收合${ic('down',14)}</span></summary>
      <div class="pd-bd">
        <p class="pd-intro">本計畫由職務計畫書與階段性評核組成，透過設定工作目標、定期檢視與面談，協助員工逐步熟悉職務內容、確認工作表現，並作為後續培育與發展的重要依據。</p>
        <hr class="pd-sep">

      ${stat('all','c0','users',n.all,'負責人員','目前由您執行計畫的人員數')}

      </div>
      ${C.length>6?`<div class="search" style="max-width:260px">${ic('search')}<input id="cq" placeholder="搜尋人員姓名" value="${esc(this.q)}"></div>`:''}
    </div>

    ${n.wait?`<div class="mut" style="margin-top:14px">${ic('info',14)} 有 ${n.wait} 位人員的職務計畫書已完成、正在等待人資開啟下一階段評核，可在「全部人員」中查看。</div>`:''}`;
    document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ this.f=b.dataset.f; this.render(); });
    $('#planDoc').ontoggle=e=>{ try{ localStorage.setItem('jpt_plandoc', e.target.open?'1':'0'); }catch(x){} };
    if($('#cq')) $('#cq').oninput=e=>{ this.q=e.target.value; this.cards(); };
    this.cards();
  },
  cards(){
    const ord={ext:0,eval:0,draft:1,todo:2,wait:3,done:4}, q=this.q.trim();
    const L=this.cases.filter(c=>{ const st=caseState(c);
      if(this.f==='pending' ? !['todo','draft','eval','ext'].includes(st) : (this.f!=='all' && st!==this.f)) return false;
      return !q || c.name.includes(q); }).sort((a,b)=>ord[caseState(a)]-ord[caseState(b)] || a.startDate.localeCompare(b.startDate));
    const el=$('#ccards');
    if(!L.length){ el.innerHTML=`<div class="card"><div class="empty">${ic('inbox',32)}<br>${this.cases.length?'沒有符合條件的人員':'目前沒有指派給您的人員'}</div></div>`; return; }
    const card=(title,x,tip)=>`<div class="pc ${x.k}" title="${esc(tip||'')}">${x.k.startsWith('cur')?'<span class="now">目前進行步驟</span>':''}
      <div class="hd">${ic(x.ic,16)}<span>${title}</span></div><span class="tg">${x.t}</span><div class="d">${esc(x.d)}</div></div>`;
    el.innerHTML=L.map(c=>{ const T=this.todo(c), pr=this.period(c);
      const cards=[card('職務計畫書',this.planCard(c),'職務計畫書：填寫 → 面談 → 面談紀錄 → 雙方簽名')]
        .concat(c.stages.flatMap((s,i)=>(rvFormal(c)?(s.reviews||[]).map((r,k)=>card(r.label,this.rvCard(c,i,k),`${r.label}　預計評核 ${r.due}`)):[]).concat([card(s.label+(s.ext?'（延長）':''),this.stageCard(c,i),`${s.label}　${s.from} ～ ${s.to}　預計評核 ${s.due}`+((s.reviews||[]).length?`　追蹤評核：${s.reviews.map(r=>r.label+' '+r.due).join('、')}`:''))])));
      const cls=T.kind==='late'?'late':T.kind==='act'?'act':caseState(c)==='done'?'fin':'';
      return `<div class="prow ${cls}">
        <div class="pr-grid">
          <div class="pr-id"><span class="avatar">${esc((c.name||'?').charAt(0))}</span>
            <div style="min-width:0"><div class="row"><b>${esc(c.name)}</b>${typeTag(c.type)}</div>
              <div class="meta">${esc(c.dept)||'—'}｜${esc(c.title)||'—'}</div>
              <div class="per"><span class="chip b">${ic('calendar',12)}計畫期間 ${pr.len}</span><span>${pr.rng}</span></div>
              ${cadOf(c)!=='std'?`<div class="per"><span class="chip">${CADENCES[cadOf(c)].name}</span></div>`:''}</div></div>
          <div class="pcs" style="--n:${cards.length}">${cards.join('')}</div>
        </div>
        <div class="pr-todo ${T.kind}"><div class="tx">${ic(T.kind==='idle'?'info':'flag',15)}<span><b>${T.lab}：</b>${esc(T.tx)}</span></div>
          <button class="btn ${T.b[0]==='t'?'t':'o'}" data-open="${c.id}">${ic(T.b[1])}${T.b[2]}</button></div>
      </div>`; }).join('');
    el.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>this.open(x.dataset.open));
  }
};

var Manager; Manager = {
  id:'', token:'', c:null, sigs:{}, dirtySigs:{}, tab:'plan', dirty:false,
  STEPS: ['第一階段計畫','第二階段計畫','第三階段計畫','面談紀錄與員工回饋','確認與簽核'],
  steps(){ return rvFormal(this.c) ? this.c.stages.slice(0,BASE_STAGES).map(s=>planLabel(this.c,s)).concat(this.STEPS.slice(BASE_STAGES)) : this.STEPS; },
  SIGN_STEP: 4,
  STEP_MONTHS: { '12m':['0-3個月','4-7個月','8-12個月'], '6m':['1-2個月','3-4個月','5-6個月'], '3m':['1個月','2個月','3個月'] },
  /* 階段計畫步驟標題顯示該人員實際的階段期間（依人資設定的生效日計算）；STEP_MONTHS 保留作為缺日期時的備用 */
  stepTitle(k){ const s=this.c.stages[k];
    if(k<BASE_STAGES && s && s.from && s.to) return this.steps()[k]+`（${md(s.from)}～${md(s.to)}）`;
    const m=(this.STEP_MONTHS[this.c.version]||this.STEP_MONTHS['12m'])[k]; return this.steps()[k]+(m?`（${m}）`:''); },
  progOpen: true,
  egsOpen: {tip:true, goal:false, content:false, outcome:false},
  step: 0, exKey: '', exStage: 0, focus:[0,0,0], editDim:-1,
  active:false,
  /* id＝案件ID；token＝主管專屬連結碼（後端會驗證此案件目前屬於該主管） */
  async init(id,token){
    Object.assign(this,{id,token,c:null,sigs:{},dirtySigs:{},tab:'plan',dirty:false,step:0,exKey:'',exStage:0,focus:[0,0,0],editDim:-1,active:true});
    $('#roleTxt').textContent='主管填寫端'; $('#topRight').innerHTML=''; Modal.close(); Drawer.close();
    $('#app').innerHTML='<div class="loading">載入中…</div>';
    try{ const r=await api('mgrGet',{id,token}); this.c=r.c; this.sigs=r.sigs||{}; }
    catch(e){ this.active=false; $('#app').innerHTML=`<div class="card" style="max-width:520px;margin:60px auto"><div class="dlg-hd danger"><span class="dlg-ic">${ic('warn',20)}</span><h2 style="margin:0">無法開啟</h2></div>${esc(e.message)}<br><span class="mut">此案件可能已改由其他主管負責，或連結已失效。</span>
      <div style="margin-top:14px"><button class="btn o" id="bk">${ic('left')}返回人員列表</button></div></div>`; $('#bk').onclick=()=>MgrHome.back(); return; }
    $('#topRight').innerHTML=`<button class="btn o s" id="pr">${ic('printer')}列印／存 PDF</button>`;
    $('#pr').onclick=()=>Printer.choose(this.c,this.sigs);
    const c=this.c;
    if(c.plan.locked){ const x=c.stages.findIndex((s,i)=>this.extEditable(i)), i=c.stages.findIndex((s,i)=>s.eval.open && !s.eval.locked && evalReady(c,i)), w=c.stages.findIndex(s=>s.ext && !s.eval.locked);
      const rv=timeline(c).find(t=>t.rv && rvOpen(c,t.i,t.k));
      this.tab = x>=0 ? x : rv ? rv.p : i>=0 ? i : w>=0 ? w : (c.stages.every(s=>s.eval.locked) ? c.stages.length-1 : 'plan'); }
    else { let k=0; while(k<this.SIGN_STEP && this.stepDone(k)) k++; this.step=k; }
    this.focus=c.stages.map(s=>{ const j=s.items.findIndex(it=>!(it.content.trim()&&it.outcome.trim())); return j<0?0:j; });
    if(!this._bu){ this._bu=true; window.addEventListener('beforeunload',e=>{ if(this.active && this.dirty){ e.preventDefault(); e.returnValue=''; } }); }
    if(!this._as){ this._as=setInterval(()=>this.autoSave(), AUTOSAVE_MS); }   // 每 5 分鐘自動儲存草稿（有修改才存）
    this.render();
  },
  /* 返回主管工作清單（有未儲存內容時先確認） */
  async backToList(){
    if(this.dirty && !(await Dialog.confirm({title:'尚有未儲存的內容',body:'返回清單前建議先按「儲存草稿」。確定不儲存直接返回？',ok:'不儲存，返回清單'}))) return;
    this.dirty=false; this.active=false; MgrHome.back();
  },
  canOpen(i){ const c=this.c; return evalReady(c,i) && !!c.stages[i].eval.open; },
  /* ---------- 進度計算 ---------- */
  stepDone(k){
    const c=this.c;
    if(k<=2){ const s=c.stages[k]; return this.dimsOk(k) && !!s.goal.trim() && s.items.every(it=>it.content.trim()&&it.outcome.trim()); }
    if(k===3) return !ivProblems(c.plan.interview).length;
    return !!(this.sigs.plan_mgr && this.sigs.plan_emp && c.plan.signDate);
  },
  dimsOk(i){ const d=this.c.stages[i].dims; return d.length>=MIN_DIMS && d.length<=MAX_DIMS && d.every(x=>String(x).trim()); },
  stepState(k){
    const c=this.c; if(c.plan.locked || this.stepDone(k)) return 'done';
    if(k<=2){ const s=c.stages[k]; if(s.dims.length) return 'prog'; return (s.goal.trim()||s.items.some(it=>it.content.trim()||it.outcome.trim()))?'prog':''; }
    if(k===3){ const v=c.plan.interview; return (v.notes.trim()||v.understand||v.goalAdjust||v.support.length)?'prog':''; }
    return (this.sigs.plan_mgr||this.sigs.plan_emp)?'prog':'';
  },
  dimState(i,j){ const it=this.c.stages[i].items[j]; const a=!!it.content.trim(), b=!!it.outcome.trim(); return a&&b?'done':(a||b?'prog':''); },
  percent(){
    const c=this.c; let u = c.plan.locked ? 1 : [0,1,2,3,4].filter(k=>this.stepDone(k)).length/5*0.95;
    const E=evalUnits(c); u += E.d; return Math.round(u/(1+E.n)*100);
  },
  nextAction(){
    const c=this.c;
    if(!c.plan.locked){ let k=[0,1,2,3,4].find(k=>!this.stepDone(k)); if(k===undefined) k=this.SIGN_STEP; return `下一步：完成職務計畫書 — STEP ${p2(k+1)}「${this.stepTitle(k)}」`; }
    const i=c.stages.findIndex(s=>!s.eval.locked);

      : `職務計畫書已完成。${nx.r.label}評核預計於 ${nx.r.due} 進行，屆時由人資開啟後即可填寫。`;

    const miles = mile('職務計畫書','plan',c.plan.locked?'done':'prog',planSub,false) +
      c.stages.map((s,i)=>(s.reviews||[]).map((r,k)=>rvMile(s,i,r,k)).join('') + (()=>{ const st=stageStatus(c,i), xe=this.extEditable(i), xw=s.ext && s.ext.plan.locked && !s.eval.locked, open=this.canOpen(i)||s.eval.locked||xe||xw;
        const rvPend=(s.reviews||[]).some(r=>!r.eval.locked);
        const state = s.eval.locked?'done':(this.canOpen(i)||xe?(st.k==='r'?'prog late':'prog'):(c.plan.locked && (i===0||c.stages[i-1].eval.locked) && !rvPend?'wait':''));
        const sub = s.eval.locked ? '已完成 '+s.eval.lockedAt+(s.eval.paper?'（紙本）':'') : xe ? '待訂延長計畫｜'+s.from+' 起' : this.canOpen(i) ? '評核中｜'+st.t : rvPend ? '須先完成'+(rvFormal(c)?'前面的評核':'追蹤評核')+'｜預計 '+s.due : '待人資開啟｜預計評核日 '+s.due;
        return mile(s.label+(s.ext?'（延長）':'')+'評核',i,state, sub, !open); })()).join('');
    $('#app').innerHTML = `
    <div class="crumb"><button class="btn o s" id="backList">${ic('left')}返回人員列表</button><span class="mut">人員培育與職務追蹤平台 ／ ${esc(c.name)}</span></div>
    <section class="card hero">

        <div class="hero-who"><span class="avatar lg">${esc((c.name||'?').charAt(0))}</span>
          <div><div class="row">${typeTag(c.type)}<span class="mut">${STAGE_SETS[c.version].name}${c.version==='12m'?'｜'+CADENCES[cadOf(c)].name:''}</span></div><h2>${esc(c.name)}</h2><div class="mut">職務計畫與階段評核</div></div></div>
      </div>
      <div class="infogrid">
        ${[['user','受評人員',c.name],['building','部門',c.dept],['briefcase','職稱',c.title],['tag','計畫類別',c.type],['users','負責主管',c.manager],['calendar','到職日',hireOf(c)]].concat(c.type==='新進'?[]:[['calendar',effLabel(c.type),c.startDate]]).map(x=>`<div class="info"><div class="k">${ic(x[0],14)}${x[1]}</div><div class="v">${esc(x[2])||'—'}</div></div>`).join('')}
        <div class="info wide"><div class="k">${ic('clock',14)}計畫期間</div><div class="v">${c.stages[0].from} ～ ${c.stages[2].to}${c.stages.length>BASE_STAGES?`<br><span class="mut">延長至 ${c.stages[c.stages.length-1].to}</span>`:''}</div></div>

    document.querySelectorAll('.mile').forEach(b=>b.onclick=async()=>{ if(b.disabled) return;
      const t=b.dataset.t==='plan'?'plan':isRvPart(b.dataset.t)?b.dataset.t:Number(b.dataset.t); if(t===this.tab) return;
      if(this.dirty && !(await Dialog.confirm({title:'尚有未儲存的內容',body:'切換前建議先按「儲存草稿」。確定不儲存直接切換？',ok:'不儲存，直接切換'}))) return;
      if(this.dirty){ const r=await api('mgrGet',{id:this.id,token:this.token}); this.c=r.c; this.sigs=r.sigs||{}; this.dirtySigs={}; }

  },
  bindInputs(){
    const body=$('#body'); if(body._bound) return; body._bound=true;
    body.addEventListener('input',e=>{ const el=e.target; if(!el.dataset.bind || el.type==='radio') return; setPath(this.c, el.dataset.bind, el.value); this.dirty=true; this.onInput(el); });

      el.closest('.opts').querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel', l.querySelector('input').checked)); this.onInput(el); } });
  },
  onInput(el){
    const b=el.dataset.bind;
    if(this.tab==='plan'){
      const m=/^stages\.(\d)\.items\.(\d+)\./.exec(b);
      const dm=/^stages\.(\d)\.dims\.(\d+)$/.exec(b);
      if(dm) this.onDimName(+dm[1], +dm[2], el);
      if(m){ const i=+m[1], j=+m[2]; const t=document.querySelector(`.dimtab[data-f="${j}"]`); if(t){ t.classList.remove('done','prog'); const s=this.dimState(i,j); if(s) t.classList.add(s); } this.refreshDimProg(i); }
      if(this.isV2(this.step) && (m||dm)){ const i=+(m||dm)[1], j=+(m||dm)[2]; this.refreshCard(i,j); this.refreshDimProg(i); }
      this.refreshStepper();
    } else if(this.isExtTab()){
      const m=/^stages\.(\d)\.items\.(\d+)\./.exec(b), dm=/^stages\.(\d)\.dims\.(\d+)$/.exec(b);
      if(dm) this.onDimName(+dm[1], +dm[2], el);
      if(m||dm){ const i=+(m||dm)[1], j=+(m||dm)[2]; this.refreshCard(i,j); this.refreshDimProg(i); }
    } else if(isRvPart(this.tab)){ this.refreshRvProg(this.tab); const nr=$('#noteReq'); if(nr){ const rs=rvOf(this.c,this.tab).eval.result; nr.style.display=rs && rs!==rvResults(this.c)[0]?'':'none'; }
    } else if(typeof this.tab==='number'){ this.refreshEvalProg(this.tab); const xb=$('#extBox'); if(xb){ xb.style.display=this.c.stages[this.tab].eval.conclusion==='延長觀察'?'':'none'; if(/eval\.conclusion$/.test(b)){ this.bindXPlan(this.tab); autoGrow(xb); } } const nr=$('#noteReq'); if(nr) nr.style.display=(this.c.stages[this.tab].eval.conclusion&&this.c.stages[this.tab].eval.conclusion!=='通過')?'':'none'; }
  },
  /* ---------- 職務計畫書 ---------- */
  ex(){ if(!this.exKey){ const e=EXAMPLES.find(x=>x.type===this.c.type)||EXAMPLES[0]; this.exKey=e.key; } return EXAMPLES.find(x=>x.key===this.exKey); },
  stepperHTML(){
    const st=this.step, txt={done:ic('check',13)+'已完成',prog:'填寫中','':'尚未開始'};

  },
  refreshStepper(){ this.refreshTop(); const s=$('.stepper'); if(!s) return; s.innerHTML=this.stepperHTML(); this.bindStepper(); },
  bindStepper(){ document.querySelectorAll('.stp').forEach(b=>b.onclick=()=>this.goStep(Number(b.dataset.step))); },
  goStep(k){
    if(k>=3){ const miss=this.planMissing(false, k===this.SIGN_STEP); if(miss.length) return Dialog.missing(miss,x=>this.goMissing(x)); }

  renderPlan(){

      $('#body').innerHTML=`<div class="banner g">${ic('lock')}<span>職務計畫書已於 <b>${c.plan.lockedAt}</b> 完成面談簽核並鎖定。如需修改，請洽人資部解鎖。</span></div>
        ${this.summaryHTML()}${this.ivSummaryHTML(false)}<div class="card"><h2>${ic('pen')}面談確認與簽名</h2>${this.sigHTML('plan',true)}<div class="mut" style="margin-top:10px">${ic('calendar',14)} 簽署日期：${c.plan.signDate||c.plan.lockedAt}</div></div>`;

        <button class="btn o s" id="toPrint">${ic('printer')}預覽列印版</button></div></div>
      ${this.summaryHTML()}${this.ivSummaryHTML(true)}
      <div class="card" id="sigPlan"><h2>${ic('pen')}面談確認與簽名</h2>${this.sigHTML('plan',false)}
      <label class="f" style="max-width:260px;margin-top:14px"><span>簽署日期${REQ}</span><input type="date" id="signDate" data-bind="plan.signDate" value="${esc(c.plan.signDate||'')}"></label>
      <label class="ack"><input type="checkbox" id="ack"> 受評人員已了解本職務計畫內容與評核方式${REQ}</label></div>`;
    this.bindInputs(); this.bindStepper(); this.refreshTop();

    if(st===3) this.bindIv();

      if(st<=2 && !this.dimsOk(st)) return Dialog.missing(this.planMissing(false).filter(x=>x.dimset && x.step===st),x=>this.goMissing(x));

      if(st===3){ const miss=ivProblems(this.c.plan.interview).map(x=>Object.assign(x,{step:3})); if(miss.length) return Dialog.missing(miss,x=>this.goMissing(x)); }

  /* ===== STEP 04：面談紀錄與員工回饋（資料：plan.interview） ===== */

  planMissing(withSign, withIv){

    c.stages.forEach((s,i)=>{
      if(!s.goal.trim()) L.push({m:`${planLabel(this.c,s)}：階段目標未填寫`,step:i});
      if(s.dims.length<MIN_DIMS) L.push({m:`${planLabel(this.c,s)}：工作面向至少需要 ${MIN_DIMS} 個（目前 ${s.dims.length} 個）`,step:i,dimset:1});
      if(s.dims.length>MAX_DIMS) L.push({m:`${planLabel(this.c,s)}：工作面向最多 ${MAX_DIMS} 個（目前 ${s.dims.length} 個），請刪除多餘的面向`,step:i,dimset:1});
      s.dims.forEach((d,j)=>{ if(!String(d).trim()) L.push({m:`${planLabel(this.c,s)}：第 ${j+1} 個工作面向尚未命名`,step:i,dim:j,dimset:1}); });
      s.dims.forEach((d,j)=>{ const it=s.items[j], nm=d||('面向'+(j+1));
        if(!it.content.trim()) L.push({m:`${planLabel(this.c,s)}｜${nm}：工作內容未填寫`,step:i,dim:j});
        else if(contentCount(it.content)<MIN_CONTENT_ITEMS) L.push({m:`${planLabel(this.c,s)}｜${nm}：工作內容至少需要 ${MIN_CONTENT_ITEMS} 項（一行一項，目前 ${contentCount(it.content)} 項）`,step:i,dim:j});

    });

      if(!this.sigs.plan_mgr) L.push({m:'面談主管尚未簽名',anchor:'sigPlan'});
      if(!this.sigs.plan_emp) L.push({m:'受評人員尚未簽名',anchor:'sigPlan'});
      if(!c.plan.signDate) L.push({m:'尚未填寫簽署日期',anchor:'sigPlan'});

    }
    return L;

  async submitPlan(){

  sameAsExample(){

    let n=0; this.c.stages.forEach(s=>{ if(pool.has(s.goal)) n++; s.items.forEach(it=>{ if(pool.has(it.content)) n++; if(pool.has(it.outcome)) n++; }); });

  /* 面向名稱即時更新（不重繪，避免游標跳走） */

  refreshDimProg(i){ const D=this.c.stages[i].dims, n=D.length; if(!$('#dpCnt')) return; const d=D.filter((_,j)=>this.isV2(i)?this.cardState(i,j)==='done':this.dimState(i,j)==='done').length;

          <div class="dr-sec"><div class="dr-t">2. 選擇工作面向<span class="sp"></span><span class="chip ${n>=MIN_DIMS&&n<=MAX_DIMS?'g':'a'}" id="dimCount">已選 ${n}／${MAX_DIMS}${n<MIN_DIMS?`（至少 ${MIN_DIMS} 個）`:''}</span></div>

          ${n?`<div class="dcards" id="dcards">${D.map(card).join('')}</div>`
            :`<div class="dcempty">${ic('grid',26)}<br>尚未加入工作面向<br><span class="mut">請從上方推薦面向點選，或「自行新增工作面向」</span>
              ${i>0 && c.stages[i-1].dims.some(d=>String(d).trim())?`<div style="margin-top:12px"><button class="btn o s" id="copyPrev">${ic('dup',14)}沿用${c.stages[i-1].label}的 ${Math.min(c.stages[i-1].dims.filter(d=>String(d).trim()).length,MAX_DIMS)} 個面向名稱</button></div>`:''}</div>`}
