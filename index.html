    </div>
    <div class="card excta"><div><h3>${ic('book')} 不知道怎麼寫？</h3><div class="mut">可先查看「${esc(this.ex().title)}」等參考範例的寫法，再依受評人員的實際職務撰寫。</div></div>
      <div class="row"><button class="btn o" data-openex>${ic('eye')}查看參考範例</button></div></div>`;
  },
  /* 即時更新單張卡片的名稱與狀態（不重繪，避免游標跳走） */
  refreshCard(i,j){
    const el=document.querySelector(`.dcard[data-j="${j}"]`); if(!el) return;
    const d=String(this.c.stages[i].dims[j]||'').trim(), nm=el.querySelector('.dc-name'), st=el.querySelector('[data-st]'), k=this.cardState(i,j);
    nm.textContent=d||'（請輸入面向名稱）'; nm.classList.toggle('empty',!d);
    st.className='dc-st '+k; st.textContent={'':'尚未填寫',prog:'填寫中',done:'已完成'}[k];
  },
  addDim(i,name){
    const c=this.c, s=c.stages[i], D=s.dims;
    if(D.length>=MAX_DIMS) return toast(`工作面向最多 ${MAX_DIMS} 個`);
    D.push(name); s.items.push({content:'',outcome:''}); s.eval.ratings.push(''); s.eval.comments.push(''); s.eval.checks.push([]);
    c.dims=unionDims(c); this.dirty=true; this.focus[i]=D.length-1; this.redraw();
    const el=$('#dcard'+(D.length-1)); if(el) el.scrollIntoView({block:'nearest'});
    if(!name){ const inp=$('#dimName'); if(inp) inp.focus(); } else toast(`已加入「${name}」，請填寫工作內容與預期成果`);
  },
  removeDim(i,j){
    const c=this.c, s=c.stages[i];
    [s.dims,s.items,s.eval.ratings,s.eval.comments,s.eval.checks].forEach(a=>a.splice(j,1));
    const f=this.focus[i]; this.focus[i] = f===j ? -1 : (f>j ? f-1 : f);
    c.dims=unionDims(c); this.dirty=true; this.redraw();
  },
  async delDim(i,j){
    const s=this.c.stages[i], it=s.items[j], nm=String(s.dims[j]||'').trim()||'未命名面向';
    if((it.content.trim()||it.outcome.trim()) && !(await Dialog.confirm({title:'刪除工作面向',icon:'trash',danger:true,ok:'刪除',
      body:`確定要刪除「<b>${esc(nm)}</b>」？此面向已填寫的工作內容與預期成果會一併刪除（儲存草稿前仍可重新整理頁面放棄變更）。`}))) return;
    this.removeDim(i,j); toast(`已刪除「${nm}」`);
  },
  /* 調整順序：dims、items 及 eval 的對應陣列一起移動，維持一一對應 */
  moveDim(i,from,to){
    const c=this.c, s=c.stages[i], n=s.dims.length;
    if(from===to || to<0 || to>=n) return;
    [s.dims,s.items,s.eval.ratings,s.eval.comments,s.eval.checks].forEach(a=>{ while(a.length<n) a.push(Array.isArray(a[0])?[]:''); a.splice(to,0,a.splice(from,1)[0]); });
    const f=this.focus[i];
    if(f===from) this.focus[i]=to; else if(f>=0){ if(from<f && to>=f) this.focus[i]=f-1; else if(from>f && to<=f) this.focus[i]=f+1; }
    c.dims=unionDims(c); this.dirty=true; this.redraw();
    const el=$('#dcard'+to); if(el){ el.scrollIntoView({block:'nearest'}); }
  },
  bindStageV2(i){
    const s=this.c.stages[i], D=s.dims;
    this.refreshDimProg(i);
    const go=j=>{ this.focus[i]=j; this.redraw(); const el=$('#dcard'+(j<0?0:j)); if(el) el.scrollIntoView({block:'nearest'}); };
    document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ this.dimCat[i]=b.dataset.cat; this.redraw(); });
    document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{
      const name=b.dataset.rec, j=D.findIndex(d=>String(d).trim()===name);
      if(j<0) return this.addDim(i,name);
      const it=s.items[j];
      if(!it.content.trim() && !it.outcome.trim()){ this.removeDim(i,j); toast(`已取消「${name}」`); }
      else { go(j); toast('此面向已有填寫內容，如需移除請使用卡片右側的「更多操作 → 刪除面向」',3800); } });
    if($('#addOwn')) $('#addOwn').onclick=()=>this.addDim(i,'');
    if($('#copyPrev')) $('#copyPrev').onclick=()=>{ const c=this.c, prev=c.stages[i-1].dims.map(d=>String(d).trim()).filter(Boolean).slice(0,MAX_DIMS);
      prev.forEach(d=>{ D.push(d); s.items.push({content:'',outcome:''}); s.eval.ratings.push(''); s.eval.comments.push(''); s.eval.checks.push([]); });
      c.dims=unionDims(c); this.dirty=true; this.focus[i]=0; this.redraw(); toast('已帶入面向名稱，工作內容與預期成果請依本階段重新填寫'); };
    document.querySelectorAll('[data-tg]').forEach(h=>h.onclick=e=>{ if(e.target.closest('[data-more]')) return; const j=Number(h.dataset.tg); go(this.focus[i]===j?-1:j); });
    document.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const j=Number(b.dataset.more), n=D.length;
      Menu.open(b,[...(j>0?[{icon:'up',label:'上移',fn:()=>this.moveDim(i,j,j-1)}]:[]),
        ...(j<n-1?[{icon:'down',label:'下移',fn:()=>this.moveDim(i,j,j+1)}]:[]),
        ...(n>1?['-']:[]),
        {icon:'trash',label:'刪除面向',danger:true,fn:()=>this.delDim(i,j)}]); });
    if($('[data-close-card]')) $('[data-close-card]').onclick=()=>go(-1);
    if($('[data-next-card]')) $('[data-next-card]').onclick=()=>go(this.focus[i]+1);
    /* 拖曳排序（桌機）；手機可用「更多操作 → 上移／下移」 */
    let from=-1;
    const clear=()=>document.querySelectorAll('.dcard').forEach(x=>x.classList.remove('over-top','over-bot','dragging'));
    document.querySelectorAll('.dcard').forEach(card=>{
      const j=Number(card.dataset.j), hd=card.querySelector('.dc-hd');
      hd.addEventListener('dragstart',e=>{ from=j; card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',String(j)); }catch(_){} });
      hd.addEventListener('dragend',()=>{ from=-1; clear(); });
      card.addEventListener('dragover',e=>{ if(from<0) return; e.preventDefault(); const r=card.getBoundingClientRect(), top=e.clientY<r.top+r.height/2;
        card.classList.toggle('over-top',top); card.classList.toggle('over-bot',!top); });
      card.addEventListener('dragleave',()=>card.classList.remove('over-top','over-bot'));
      card.addEventListener('drop',e=>{ if(from<0) return; e.preventDefault(); const r=card.getBoundingClientRect(), after=e.clientY>=r.top+r.height/2;
        let pos=j+(after?1:0); if(pos>from) pos--; const f=from; from=-1; clear(); if(pos!==f){ this.moveDim(i,f,pos); toast('已調整順序'); } });
    });
    autoList($('#ct'+i),'num'); autoList($('#oc'+i),'bul');
    const dn=$('#dimName'); if(dn) dn.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); dn.blur(); } };
    document.querySelectorAll('details.egs,details.tipd').forEach(d=>d.addEventListener('toggle',()=>{
      const k=d.dataset.egs; this.egsOpen[k]=d.open; const tg=d.querySelector('.egs-tg'); if(tg) tg.textContent=d.open?'收合':'展開'; }));
  },
  /* =====================================================================
     延長階段（第四、五階段）：先訂延長計畫並雙方簽名（表單 'x3'／'x4'），期滿由人資開啟評核
     ===================================================================== */
  extEditable(i){ const c=this.c, s=c.stages[i]; return !!(s && s.ext && !s.ext.plan.locked && c.stages[i-1].eval.locked); },
  isExtTab(){ return typeof this.tab==='number' && this.extEditable(this.tab); },
  /* 依目前分頁重繪（工作面向卡片元件在計畫書與延長計畫共用） */
  redraw(){ this.tab==='plan' ? this.renderPlan() : this.renderTab(); },

  renderExtPlan(i){

  extMissing(i){
    const c=this.c, s=c.stages[i], k=SIGKEYS('x'+i), L=[];
    if(!s.goal.trim()) L.push({m:'延長期間的階段目標未填寫',anchor:'goal'+i});
    if(s.dims.length<MIN_DIMS) L.push({m:`工作面向至少需要 ${MIN_DIMS} 個（目前 ${s.dims.length} 個）`,anchor:'dimset'});
    if(s.dims.length>MAX_DIMS) L.push({m:`工作面向最多 ${MAX_DIMS} 個（目前 ${s.dims.length} 個）`,anchor:'dimset'});
    s.dims.forEach((d,j)=>{ const it=s.items[j], nm=String(d).trim()||('面向'+(j+1));
      if(!String(d).trim()) L.push({m:`第 ${j+1} 個工作面向尚未命名`,anchor:'dimset',dim:j});
      if(!it.content.trim()) L.push({m:`${nm}：工作內容未填寫`,anchor:'dimset',dim:j});
      if(!it.outcome.trim()) L.push({m:`${nm}：預期成果未填寫`,anchor:'dimset',dim:j}); });
    if(!this.sigs[k[0]]) L.push({m:'面談主管尚未簽名',anchor:'sigExt'});
    if(!this.sigs[k[1]]) L.push({m:'受評人員尚未簽名',anchor:'sigExt'});

  refreshRvProg(p){
    const s=this.c.stages[Number(p[1])], e=rvOf(this.c,p).eval, n=s.dims.length, d=e.ratings.filter(Boolean).length;

  },
  submitReview(p){
    const c=this.c, s=c.stages[Number(p[1])], r=rvOf(c,p), e=r.eval, [a,b]=SIGKEYS(p), L=rvProblems(c,p);
    if(!this.sigs[a]) L.push({m:'面談主管尚未簽名',anchor:'evSig'});
    if(!this.sigs[b]) L.push({m:'受評人員尚未簽名',anchor:'evSig'});
    if(L.length) return Dialog.missing(L,x=>this.goMissing(x));

     儲存期間若主管仍在輸入，保留畫面上的新內容（不以伺服器回傳覆蓋），下一次再存 */
  async autoSave(){
    if(!this.active || !this.dirty || this._saving || $('#modal')) return;
    const ok=await this.save(undefined,'auto');

    if(this._saving) return false; this._saving=true;

  },
  async save0(lockPart,silent){
    if(silent==='auto'){   // 自動儲存：不鎖按鈕、不打斷輸入
      const sent=JSON.stringify(this.c), sentSigs=Object.assign({},this.dirtySigs);
      try{
        const r=await api('mgrSave',{id:this.id,token:this.token,c:this.c,sigs:sentSigs});
        const changed=JSON.stringify(this.c)!==sent;
        if(!changed) this.c=r.c;
        Object.keys(sentSigs).forEach(k=>{ if(this.dirtySigs[k]===sentSigs[k]) delete this.dirtySigs[k]; });
        this.sigs=Object.assign({}, r.sigs||{}, this.dirtySigs);
        this.dirty = changed || Object.keys(this.dirtySigs).length>0;
        return true;
      }catch(e){ toast('自動儲存失敗：'+e.message+'。請按「儲存草稿」再試一次',4200); return false; }
    }
    const btns=document.querySelectorAll('.stickybar .btn'); btns.forEach(b=>b.disabled=true);
    try{
      if(lockPart!==undefined){ const err=validatePart(this.c,this.sigs,parsePart(lockPart)); if(err) throw new Error(err); }
      const r=await api('mgrSave',{id:this.id,token:this.token,c:this.c,sigs:this.dirtySigs,lockPart});
      this.c=r.c; this.sigs=r.sigs||{}; this.dirtySigs={}; this.dirty=false;

      else if(!silent) toast('草稿已儲存');
      btns.forEach(b=>b.disabled=false); return true;
    }catch(e){ toast(e.message,3200); }
    btns.forEach(b=>b.disabled=false); return false;
  }
};

/* ---------------- 簽名板 ---------------- */
function SigPad(cv,onDone){
  const ctx=cv.getContext('2d'); let drawing=false, last=null, has=false;
  const size=()=>{ const r=cv.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,2); cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.scale(dpr,dpr);
    ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
    ctx.fillStyle='#bbb'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('請在此簽名',r.width/2,r.height/2+5); };
  size();
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown',e=>{ if(!has){ const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); has=true; }
    drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,Math.PI*2); ctx.fillStyle='#111'; ctx.fill(); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
  const end=()=>{ if(!drawing) return; drawing=false; onDone(exportSig(cv)); };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('pointerleave',end);
}
function exportSig(cv){
  // 縮小並轉白底 PNG，控制檔案大小（試算表單格上限約 5 萬字元）
  const W=480, H=Math.round(480*cv.height/cv.width); const o=document.createElement('canvas'); o.width=W; o.height=H;
  const x=o.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.drawImage(cv,0,0,W,H);
  let d=o.toDataURL('image/png'); if(d.length>40000) d=o.toDataURL('image/jpeg',0.7); return d;
}

    setTimeout(()=>{ try{ window.print(); }catch(e){ toast('此環境無法開啟列印，請改用部署後的網址'); } document.title=old; },150);

    $('#app').innerHTML=`<div class="card"><h2>whoseTurn 測試：${R.length-bad} / ${R.length} 通過${bad?`（${bad} 項失敗）`:''}</h2>
      <div style="overflow-x:auto"><table class="list"><thead><tr><th>結果</th><th>情境</th><th>預期</th><th>實際</th></tr></thead><tbody>
      ${R.map(x=>`<tr><td>${x.ok?'✅ 通過':'❌ 失敗'}</td><td>${esc(x.name)}</td><td>${x.who}｜${esc(x.reason)}</td><td>${x.err?'錯誤：'+esc(x.err):x.r.who+'｜'+esc(x.r.reason)}</td></tr>`).join('')}
      </tbody></table></div><p class="mut">這個測試只在示範模式執行，不會讀寫任何資料。</p></div>`;
    return {pass:R.length-bad, total:R.length};
  }
};
/* ---------------- 啟動 ---------------- */
if(DEMO && Q.get('test')==='whoseTurn') WhoseTurnTest.run();
else if(Q.get('m')) MgrHome.init(Q.get('m'), Q.get('c'));
else if(Q.get('c') && Q.get('k')){   // 舊版單一案件連結：已停用（後端同樣拒絕）
  $('#roleTxt').textContent='主管填寫端';
  $('#app').innerHTML=`<div class="card" style="max-width:520px;margin:60px auto"><div class="dlg-hd danger"><span class="dlg-ic">${ic('warn',20)}</span><h2 style="margin:0">此連結已停用</h2></div>系統已改為「一位主管一個專屬連結」，請洽人資部取得您的主管專屬連結。</div>`;
}
else Admin.init();
</script>
